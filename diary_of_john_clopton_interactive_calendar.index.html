ned at Ketton Hall. I walkt from my house with Mr Kemp to Mr Owen’s & there we parted.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-20", "day": "Saturday", "info": "\"After dinner I walkt & saw Sir Thomas & Lady. Mr Kemp came home with me & stayd an howre.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-21", "day": "Sunday", "info": "\"I heard Mr Burrell in the forenoone on his former text; my wife & I walkt to Ketton after dinner, heard Mr Fayrecloth on his wonted subject, ‘When thou art converted strengthen thy brethren.’ He treated on mortification & how restrayning grace resembles it, & how far a man may goe in that & not be truly mortified\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-21", "day": "", "info": "\"Newes that Ireton was slain in Ireland\"", "category": "News", "color": "#F28C28", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-22", "day": "Monday", "info": "\"I borrowed Mr Burrell’s nag & rode to Thomas Flanders with him to buy a horse but he was not at home. We rode [in the afternoone] to Dick Milton’s,\nstayed an houre & rode to Ketton Hall by Stubbins to see his horse, which he broute up to the Hall & Sir Thomas boute him for £10 10s.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-23", "day": "Tuesday", "info": "\"I sent Page to Newmarket for a coome of seed wheat he boute for £1 7s. 0d.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-23", "day": "", "info": "\"Sir Thomas & Mr Owen visited towards night\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-24", "day": "Wednesday", "info": "\"I stayd at home, was with the two Sheldrakes, Stubbing of Stanlies & the two Harvies, old Rich[ard] his sons, fencing Phillip Mellar’s, & my plough in Redfeild\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-25", "day": "Thursday", "info": "\"My men sew wheat in New Hall feild, & fetcht wood out of Phillip Meller’s towards night.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-26", "day": "Friday", "info": "\"I walkt to Ketton Hall, dined there\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-26", "day": "", "info": "\"I sew wheat in the hither New Hall feild.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-27", "day": "Saturday", "info": "\"Mr Kempe came to me in the morning, told me he had boute a horse for me in Norfolk. I went to see him in the afternoone, walked with him to Robert Webb’s & came home at night. My brother Smyth came this night to me\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-28", "day": "Sunday", "info": "\"My brother Smyth & I walkt to Ketton, heard Mr Fayrecloth of his former text, ‘When thou art converted strengthen thy brethren.’ \"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-28", "day": "", "info": "\"Sir Nathaniel sent me a letter to go to my cosin Brooke & live neare them upon some termes.\"", "category": "News", "color": "#F28C28", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-29", "day": "Monday", "info": "\"Mr Kemp, my wife & I set forth for Braintre, & left my brother Smyth at my house, who went to Sir Thomas & lay there till we came home. We stayd an howre at the Swan at Sible Hedingham, & came to Brayntre a little before night, & lay at my uncle Mott’s. Or horses stood at the Cock.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-30", "day": "Tuesday", "info": "\"My wife & I in the afternoone visited Mr & Mrs Draper, & lay at my uncle Mott’s.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-31", "day": "Wednesday", "info": "\"We sett out from Brayntre about 11, cald at Halstead, stayd 2 howrs & saw Mr Covell & William Clopton & came home an howre within evening.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-11-01", "day": "Thursday", "info": "\"My brother Smyth & I walkt after dinner to Ketton Hall, stayd 2 howres. Mr Kemp visited us in that morning.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-11"}, {"date": "1649-11-01", "day": "", "info": "\"This day was thanksgiving day for Ireland, Cromwell’s great victory. Mr\nBurrell preacht but few else.\"", "category": "Sermon - weekday (thanksgiving)", "color": "#27AE60", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-11"}, {"date": "1649-11-01", "day": "", "info": "\"I paid John Dodding £6.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-11"}, {"date": "1649-11-02", "day": "Friday", "info": "\"I was at Ketton by 5 in the morning, saw Sir Thomas & Lady & tooke my leave of them goeing then to London. Mr Kempe came home &\ndined with us\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-11"}, {"date": "1649-11-02", "day": "", "info": "", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-11"}, {"date": "1649-01-31", "day": "Thursday", "info": "\"In the afternoone Mr Kemp visited me & stayed twor three howres with me\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1649-01"}, {"date": "1649-01-31", "day": "", "info": "\"I sew bullimong in Wheatcroft\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1649-01"}, {"date": "1649-01-31", "day": "", "info": "\"At night wrote 4 letters to be sent the next day.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1649-01"}, {"date": "1649-02-01", "day": "Friday", "info": "\"I sent my boy Watt with 4 letters, viz. to my brother William Clopton, then to Higham & soe to Burfold about Mr Kemp’s busines. I went to Ketton in the morning to meet John Dodding senior to borrow £10 from him but the man would not lend it unles I were bound, which I would not.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-01", "day": "", "info": "\"I came home to dinner & in the afternoone began \\to hedge/ my new ditch in Stanlies & to set willow setlings.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-02", "day": "Saturday", "info": "\"Candlemas day\"; \"My folks went to plow in Wheatcroft, sew bull[imong]. This day I hedgd in Stanlies & sett my willow setlings.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-02", "day": "", "info": "\"In the afternoone I walkt to Mr Owen’s; he was gone out. I stayd an howre but saw him not. Sir Thomas & my Lady with little Jane & Nathaniel dined at Sir William Soame’s this day & visited me about 6 at night, stayd an howre.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-03", "day": "Sunday", "info": "\"My boy Wat came home about noone from Burfold, Higham &\nListon, where he lay last night, broute me letters from my brother\nMark, brother Smyth & brother Alby, who wrote me word his wife had\nbin broute to bedd a weeke past. A blustering day, rainy & windy\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-04", "day": "Monday", "info": "\"Mr Kemp came to me in the morning. My wife & I walkt to Ketton Hall with him & dined there. We came home esarly, mett Mr Owen who came back with us\"", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-04", "day": "", "info": "\"I went & measured by rodd of ditches in Stanlies: 37 of a new ditch at 5d. 0b the rodd; the other 40 rodd at 4d. the rodd.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-04", "day": "", "info": "\"I supt this night with Mr Owen.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-05", "day": "Tuesday", "info": "\"I sew bullimong in Wheatcroft.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-05", "day": "", "info": "\"Mr Sparrow of Birdbrook visited me, stayd an howre and quarter. I walkt towards Ketton Hall after he went away & mett Mr Kemp in Mill feild & came back with him. He stayd with me till 6 of clock\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-05", "day": "", "info": "\"I wrote by him letters to my brother Marke, whom he suposd he should meet at Brayntre the next day, & to Mr Draper & sister\nMary\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-06", "day": "Wednesday", "info": "\"Mr Kemp intended to have gone to Brayntre betimes this morning, but hearing of a nag at Bumpstead Steeple came to me by daylight & gate me with him & Sir Thomas. We were at the widow Perry’s, saw a young bey nag 5 yeare old, offred £11 5s. 0d.for him but his price was £12. From there we rode to Helions Bumpstead to one Mr Lewes but liked not his horse. We stayd soe long it was to [sic] late for Mr Kemp to goe to Brayntre soe that he came to Ketton & I home that night.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-07", "day": "Thursday", "info": "\"Boute 5 seame barly of one Norton of Dullingham, came home by Moulton, stayd at Mr [?]Tratly’s 2 howres, came by Lidgate. Sir Thomas tooke Nan Ward behind him. It was very late ere I gate home. I sew bullimong in Wheatcroft.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-08", "day": "Friday", "info": "\"Made a rate for the excise at church\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-08", "day": "", "info": "\"Sew bullimong in Wheatcroft\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-09", "day": "Saturday", "info": "\"I walkt to Sir Thomas & dined there, lent him £10 for his Lincolnshire jorny.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-09", "day": "", "info": "\"Mr Owen & his wife came in after dinner\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Sunday", "info": "\"Mr Burrell preacht in the forenoone, his text: ‘Ah sinfull people laden with iniquity.’ In the afternoone I went to Ketton, heard Mr Fayrecloth, his text: ‘When thou art converted strengthen thy brethren.’ \"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Monday", "info": "\"After dinner I walkt to Ketton Hall, found there at dinner cosin Giles Barnardiston, Mr Owen & his wife & Mr Thexton, my cosin An Ward’s sweetheart, who carried her to Lidgate that night. Mr Kemp came home with me & stayd with me till 7 at night\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"This day I sew pease in the further New Hall feild\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Tuesday", "info": "\"I sew pease\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"Mr Kemp & I cald on Captain Sherive. Mr Kemp lay with me that night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "Clopton bought Mr Kemp a \"blacke nagg he broute out of Lincolnshire for £6 13s. 4d.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Wednesday", "info": "\"I sew bullimong in the further New Hall field\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"In the afternoone Mr Kemp & I walkt to Mr Owen’s & Goodman Butcher’s\nof Blunts Hall & came home to my house at night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Thursday", "info": "\"Valentine’s day: almost 20 children came to my dore for Valentine’s. Mr Kemp & I walkt to my cosin Giles Barnardiston to Clare to dinner, cald at Mr Cutts,\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"Saw an old white nagg but likt him not\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Friday", "info": "\"In the forenoone I mett at Mr Burrell’s & made rate of or lands in towne to be presented to the commissioners at Thurlow. Cosin Giles Barnardiston cald me in the morning as he rode to Thurlow. In the afternoone Mr Kemp & I walkt to John Westrop’s to see a mare. He was abroad. We saw a browne nagg of his son’s the major’s but he askt £12 for him: we bad £10 10s. 0d. ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Saturday", "info": "\"I boute 4 stone beefe of Boram.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"Mr Kemp went to Ketton to dinner; I came home, & meeting with Butcher of Blunts Hall at Haverill he came home with me & dined with me\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"This day old Living made me a manger in my gelding’s stalle & layd planks\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Sunday", "info": "\"I heard Mr Burrell preach in the forenoone, his text as formerly, ‘A seed of evill doers’ out of Job 1, 3. In the afternoone I heard Mr Fayrecloth on his old text, ‘When thou art converted strengthen thy brethren.’ It rayned most of the afternoone. I rode. Mr Kempe preacht in the morning for Mr Owen, who was gone to Wixoe. In the afternoone he came to or church when I was gone to Ketton.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Monday", "info": "\"I stayd at home & made a rate at Cate’s house for the 3 months’ tax.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"I sew bullimong in Stanlies grove\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Tuesday", "info": "\"I walkt to Ketton Hall, saw Mr Kemp take his jorny to Brayntre, sent 2 letters by him, one to Mr Draper, the other my uncle, & one by him to Sir Nathaniel Barnardiston to be sent from Braintre\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"I sew bullimonge this day in Stanlies grove\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Wednesday", "info": "\"Windle & Gilbie threw up the dirt in my barne yard; my folks sew bullimong in Stanlies grove.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"Towards night Thomas Dyke of Bathan came & lay with me\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Thursday", "info": "\"Mr Owen visited me in the afternoone.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"I sew bullimong in Stanlies grove & lent old John Dodding 5s.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Friday", "info": "\"I sew bullimong in Stanlies grove\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"Thomas Dyke wroute with me. Towards night my brother Smyth came\nfrom Higham to us.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Saturday", "info": "\"I rode on my brother Smyth’s cropp to Haverill, was trimmd & boute meat & came home.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Sunday", "info": "\"Mr Burrell preacht his text as formerly. Mr Kemp went to Ketton after\nevening prayer.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Monday", "info": "\"Mr Kempe & I rode to Liston, left my brother Smyth at my house, found my brother Marke Mott at Liston. We lay there this night. This day I heard of Mr John Firmyn’s marrying M Fisher’s daughter of P. Belcham 10 dayes before.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Tuesday", "info": "\"Brother Smyth came to Liston Hall in the afternoone from my house. My brother Marke, Mr Kemp & I came home late this night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Wednesday", "info": "\"My brothers Thomas & William came on foote to my house & stayd with me.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "Went into the fields ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Thursday", "info": "\"This day was apoynted a fast by the parliament for blasphemies & heresies. Mr Burrell preacht twice, his text ‘Thou hast torne us thou canst heale us.’ . . . We kept it not as a fast\"", "category": "Sermon - weekday (fast day)", "color": "#D64545", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"This day I swapt with my brother Clopton for a little browne colt & my Straghall colt . . . I sold my brother a farrow cow alsoe for £3.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Friday", "info": "\"All my company went away but Thomas Dyke. Mr Kemp & brother Marke went home with my brother Clopton . . . I went with him & Mr Kemp to Ketton Hall & there left them.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"This day I kild two little shoates\" [pigs under one year old]", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Saturday", "info": "\"My cart fetcht a loade of straw from Mr Owen’s. I was there & came home by my corne in Wheatcroft & Red feild\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Sunday", "info": "\"Mr Burrell preacht his former text: discourst how sin spread it selfe into every member of the body.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Monday", "info": "\"I sent Windle with my Straghall colt & black cow to Liston Hall. Barsy the gardner came this day & wroute in my little garden. My men fetcht 110 pale from Haverill.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Tuesday", "info": "\"Barsy the gardner made up my paled garden. At night Windle came from Liston & broute my my [sic] browne bald colt I swapt with my brother for.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Wednesday", "info": "\"Mr Fayrecloth preacht at Haverill\" but Clopton stayed home ", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"The gardner wroute with me & Windle . . . He left my black hobd nag with me.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Thursday", "info": "\"I rode to Ketton to fetch some cabage plants for the gardner. This day Thomas Dyke went from me & I made my garden next the Street.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"This day we brewed.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Friday", "info": "\"Windle & Gilby hedged my Street garden. I stayd at home all day. My men fetcht bushes out of the woods & chaffe from Wiborow I boute of him, cost 15s\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"In the afternoone Mr Fayrecloth with his sons & daughter came to Mr Burrell’s. Mrs Fayrecloth visited my wife an howre.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Saturday", "info": "\"My cart fetcht 1400 hey from Sir Nathaniel’s farme that Dodding lived in at Ketton at 2s. p[er] cent. I hedgd in the barne garden alsoe.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Sunday", "info": "\"Mr Nathaniel Fayrecloth preacht at or towne, his text Mark 13, 37: ‘And what I say unto you I say unto all, watch.’ Made two very good sermons: his doctrine that a spirit of watchfullnes or a watchfull spirit is a soveraigne antidote to preserve us against the dangers of the times.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Monday", "info": "\"I stayd at home. Gilby & Windle hedged in Stanlies for me.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Tuesday", "info": "\"Gilby & Windle diged my barne garden for me\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"Mr Owen visited me, came from London the Saturday before.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"This afternoone I harrowed in my oates to my new broke up land in Stanlies\nwhich was my cow paster\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Wednesday", "info": "\"Mr Kemp, coming from Brayntre the night before, came to me this morning, dined with me.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"We went to Ketton in the afternoone, heard Mr Richard Fayrecloth out of xxi Revelation, 7.\"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"Gilby & Windle began to hedge my orchard garden this day.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Thursday", "info": "\"Mr Kemp & I went to Mr Owen’s after dinner, found Mr Allot of Thurlow & his wife & brother there. Thomas Dyke came to me this day, lay with me this night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"My workmen hedgd in my uper garden.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Friday", "info": "\"Mr Kemp rode to Robert Webb’s of Barnardiston & swapt betweene his grey nag & a mare of Robert’s\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"This day Walford came from Osgodby from Sir Thomas & broute me a letter from him.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Saturday", "info": "\"Nurse Page came to us this day/ Thomas Dyke went from me & Mr Kemp at night rode home of Robert Webb’s mare\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Sunday", "info": "\"I heard Mr Burrell in the morning on his former text. Mr Fayrecloth’s 3 sons, Dick, Nathaniel & Sam preacht this day. I heard Nathaniel at Ketton, Dick at Haverill, Sam at Bumpstead.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Monday", "info": "\"I went with my cart to Dullingham for 7 coome barly seed, which I boute of one William Norton that lived at the parsonage & farmed it. I paid 33s. the quarter.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"When I came home Martyn Dyke of Bumpstead was come to see little Jane, & told us one of her ribbs were broken. Thomas Dyke came with him. They dined with me. Martyn went home by Thurlow to see Mr Cocks at Sir William Soame’s, who was his chaplyn. This day Mr Kemp went to my sister to Brayntre\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Tuesday", "info": "\"I hedgd in Turners pitle . . . I fetcht alsoe 2 loades bushes out of the wood & set my beanes by my parlour windowe.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Wednesday", "info": "\"I harrowed in oats into Stanlies & hedged in further New Hall feild & Turners pitle\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"There were 9 condemned at Bury assizes.\"", "category": "News", "color": "#F28C28", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Thursday", "info": "\"I sew barly in Red feild, rode to Haverill in the afternoone, paid Boram for meat\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"When I came home I found Mr Webb of Barnardiston at my house, who stayd an howre &c.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Friday", "info": "\"I sew barly the 2nd jorney in my 5 acres in Red feild & made an end of my 4 acres in Red feild & hedgd in Old House yard. Stayd at home all day & digd.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Saturday", "info": "\"I sew barly in Red feild & made an end of my 4 acres. Gilby & Windle hedgd for me in Old House yard.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"I rode to Ketton Hall at night to see my little cosin Nathaniel, sicke of an ague.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Sunday", "info": "\"Mr Fayrecloth \\Burrell/ preacht his text as before, ‘A seed of evill doers.’ I heard Mr Fayrecloth in the afternoone out of his former text, ‘Strengthen thy brethren.’ \" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Monday", "info": "\"I sew barly in Gallow feild aftercrop.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Tuesday", "info": "\"Sir Thomas & Lady came from there Lincolneshire jorny by Milton & this day from Cambridge. I visited him at night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"I sew barly in Phillip Millers this day.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Wednesday", "info": "\"My man Page fetcht a loade of stones.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"About 7 of clocke my cosin Watt Clopton visited me & dined with me & rode after dinner to Clare . . . sodainly after Sir Thomas & my Lady came, after them came Mrs Burrell, stayd a little time & went home. ", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"This day Nathaniel Fayrecloth preacht the lecture at Ketton, his text, ‘Oh tast to see how good the Lord is.’ I heard him not.\"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Thursday", "info": "\"I rode to Clare, cald Sir Thomas at Ketton. We dined with cosin Giles Barnardiston; my cosin Wat Clopton was there & my cosin Thomas Plum & his wife. Wat Clopton after dinner went to Cambridge\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"Bout a white nagg of Henry Cutts.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"Mr Kemp was at my house this afternoone. I mett him as I came home at Blunts Hall, talkt with him halfe an howre or thereabouts.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Friday", "info": "\"I sent Wat with 2 potts of butter to Cadge’s of Clare. Parker the locksmyth hung my jack in another place & broute me home my little pistoll\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Saturday", "info": "\"My men hedged in Cock feild. I stayd at home all day.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Sunday", "info": "\"I heard Mr Burrell in the forenoone out of his former text, & Richard Fayrecloth in the afternoone out of the Canticles\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Monday", "info": "Clopton missed an ordination service because his wife and daughter were ill", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"This day Barsy the gardner was with me & sew many seeds in my gardens.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Tuesday", "info": "\"I rode to Liston betimes, mett my boy Wat from Burfold & Higham, broute home £53 of Matthew Butcher’s he left for me\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"Mary Thomson, Arthur Okeby’s wife, dined at Liston. I came home this night, cald on Sir Thomas, who tooke phisike, mett my cosin Giles Barnardiston coming from Ketton.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Wednesday", "info": "\"I stayd at home all day, sew barly in Phillip Millars.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"In the afternoone Sir Thomas visited 2 or 3 howres\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Thursday", "info": "\"I ploughed & sew barly in Phillip Millars, the last jorny. Old Livin hung a gate for me next the Street.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Friday", "info": "\"Sir Thomas & Giles Barnardardiston cald on me goeing to Thurlow meeting, when I was walkt out.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"In the afternoone I rode to Haverill, boute a chaffin dish of George Astee\"", "category": "Personal business", "color": "#6B7280", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Saturday", "info": "Cropped wood", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Sunday", "info": "\"One Mr Ely preacht with us, his text Judges 2, 4, 5. I heard Mr Fayrecloth in the afternoone on the sacrament.\" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Monday", "info": "\"I rode to Haverill in the morning to speake with cosin Farrand about the assurance of an orchard Sir Nathaniel ordered\nme to buy for him in or towne of one Mayhew of Tiptery\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"In the afternoone Sir Thomas broute my Lady to see her mayd Deb. They\ncame up to my house. Mr Flanders senior & Jaggard of Thurlow came\nto him, & Mr Burrell & Mrs Burrell were with me, & Mr Owen.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Tuesday", "info": "\"I walkt in the morning to Ketton Hall, stayed with Sir Thomas an howre & came home.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"This day I began to fallowe in Mill Field\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Wednesday", "info": "\"I walkt to Ketton after dinner, heard Mr Fayrecloth his lecture on the sacrament.\"", "category": "Sermon", "color": "#6B7280", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Thursday", "info": "\"I sent my brother Smyth’s man away with £10 he sent for.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"Towards night Sir Thomas came to me. He & I rode to Jarvis Hill & swapt 5 acres of land.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Friday", "info": "\"My man Page with 3 naggs helpt Unwyn to fetch 1500 waite of oyle & wool from Reach to or towne.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Saturday", "info": "\"My folks fallowed in Mill feild.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "", "info": "\"Sir Thomas came to me in the morning & sodainly after Mr Owen. I went\nhome with Sir Thomas & dined with him, where dined Mr Bridgman\nfrom Sir William \\s/ & Forke Isaac. After dinner came in cosin Arthur\nBarnardiston of Hedingham.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Sunday", "info": "\"Easter\" ; \"I heard Mr Burrell both courses out of his old text, ‘A seed of evill doers.’ Mr Fayrecloth had a sacrament.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1649-02-10", "day": "Monday", "info": "\"I dined at Ketton Hall, & Goodwife Barker. Sir Thomas & Lady in the afternoone rode in the coach to Thurlow, cald on [me] as\nthey came home.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1649-02"}, {"date": "1650-04-16", "day": "Tuesday", "info": "\"I visited Sir Thomas in the morning. He sent for my boots & carried me to Clare with him\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-16", "day": "", "info": "\"Sir William Pooly, Henry Cutts & A[rthur] Fisher dined\nwith us at the Friery.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-17", "day": "Wednesday", "info": "\"I boute Mayhew’s orchard & paid for \\it/ this day £15. This day\nI lost a yeare old calfe hangd in my cart.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-17", "day": "", "info": "\"James Riseby dined with me this day.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-18", "day": "Thursday", "info": "\"Sir Thomas & his Lady visited me in the afternoone about two howres.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-19", "day": "Friday", "info": "\"I fallowed in Milfeild, & cropt wood.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-19", "day": "", "info": "\"Towards night I visited Mr Owen of Little Wratten, whose wife was then sicke in bedd of an ague. This night Mr Kemp came from Norfolke (having bin gone 20 dayes).\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-20", "day": "Saturday", "info": "\"I walkt to Ketton by 5 in the morning, stayed with Sir Thomas an howre. Mr Kemp came home with me & went to Ketton to dinner & visited me againe in the afternoone.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-21", "day": "Sunday", "info": "\"I heard Mr Burrell in the forenoone on his old text, & Mr Fayrecloth in the afternoone on his old txt, ‘When thou art converted strengthen thy\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-22", "day": "Monday", "info": "\"Alsoe to [?]butt old there cane Sir Thomas [damaged] changd.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-23", "day": "Tuesday", "info": "\"I was at the court at Wratten Hall, where was Sir Thomas Barnardiston, who had a letter given him there from Sir Nathaniel intimating that the Thursday before Sir Simonds Dewes dyed of a feaver in London.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-24", "day": "Wednesday", "info": "\"I walkt to Ketton Hall to see Mr Kemp goeing to Brayntre to his mistres. When I was gone GoodwifeBarker in a discontent rode away behind my boy, but alighting at Ketton she sent the boy to Yeldham & came to us at night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-24", "day": "", "info": "\"My cosin Plum sent my nagg that stayd the day before to Brayntre this day,\nwhich was the cause my boy came not home till very late.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-25", "day": "Thursday", "info": "\"to Yeldham to my cosin Plum’s, who bookt her every day.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-26", "day": "Friday", "info": "\"I walkt to Sir Thomas in the morning, stayd 2 howres.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-27", "day": "Saturday", "info": "\"Sir Thomas visited me. I went [back] & dined with him. After dinner he went [to Thurlow meeting I came home\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-28", "day": "Sunday", "info": "\"A letching [leaching] day,\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-28", "day": "", "info": "\"Mr Burrell preacht his text as before, ‘A seed of evill doers.’ I heard him forenoone & afternoone.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-29", "day": "Monday", "info": "\"fetcht £80 from my rents\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-30", "day": "Tuesday", "info": "\"By 6 I went to Ketton, visited Mr Kemp, who came home with me.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-04-30", "day": "", "info": "\"I sent 2 bullocks to Wickham Shrub this day to summer for 4s. 6d. a peice. A fayre day.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1650, "month_key": "1650-04"}, {"date": "1650-05-01", "day": "Wednesday", "info": "\" I visited Sir Thomas in the morning & came home to dinner. Cosin Giles Barnardiston & his wife came & dined with him, & visited me & my wife in the afternoone with my Lady, but Sir Thomas rode to the fayer.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1650, "month_key": "1650-05"}, {"date": "1650-05-02", "day": "Thursday", "info": "\"I rode to Liston, dined with my brother Clopton, visited Mr Firmyn of Foxearth, his son John & his wife newly married. Came home that night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1650, "month_key": "1650-05"}, {"date": "1650-05-03", "day": "Friday", "info": "\"This day I tendred old John Dodding & young John Dodding £200, the last payment I ought them for my land in the church porch, where were Sir Thomas Barnardiston, Mr Kemp, Frier of Stetcher, the two Doddings & Thomas Unwyn. I carried it home & it was agreed that the Wedensday following we should meet at Haverill & Sir Thomas to give a morgage & to take the mony.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1650, "month_key": "1650-05"}, {"date": "1650-05-04", "day": "Saturday", "info": "\"My cart went to Cambridge this day loaden with\ntimber & came home loaden with coale. Towards night I sold a black\nnagg I boute of Mr Kemp for 20 nobles to Andrew Keats junior for £7\n10s. 0d. I receaved a letter from Sir Nathaniel this night.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Satu
