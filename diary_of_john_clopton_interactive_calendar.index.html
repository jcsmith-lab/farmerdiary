im. We broke fast with Robert French, came to Ketton Hall, where they had dined. My brothers & sister came to my house, from thence to Mr Owen’s &c.\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-03", "day": "Thursday", "info": "\"I went to Ketton in the forenoone, came home to dinner. My brothers went to Hundon fayre in the afternoone. Sir Nathaniel visited me. I came home with him\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-04", "day": "Friday", "info": "\"Sir Nathaniel, Sir Thomas, there [sic] ladies, brother Clopton, sister, brother William, Mr Kemp dined with me. It was a warming my house. After dinner my house was full of country people about the poore. My brother[s] & sister rode to Liston Hall.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-05", "day": "Saturday", "info": "\"I went to Withersfield with my cart to fetch lumber\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-05", "day": "", "info": "\"In the afternoone Mr Owen visited me, & John Dodding senior.\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-06", "day": "Sunday", "info": "\"I heard Mr Burrell, his text as formerly, ‘The ox knowes his owner’ &c.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-07", "day": "Monday", "info": "\"We dined with Giles Barnardiston\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-08", "day": "Tuesday", "info": "\"Mr Kemp visited me in the morning, Sir Nathaniel in the afternoone & Giles Barnardiston junior.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-08", "day": "", "info": "Sent Giles Barnardiston's father money that he owed him", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-09", "day": "Wednesday", "info": "\"My wife went to Ketton lecture. I stayd at home & went to meet her at night.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-10", "day": "Thursday", "info": "\"I had apoynted to meet Sir Nathaniel & Sir Thomas at Lidgate in their jorny to Mildenhall to take overseers’ accounts &c, but was sent to to come to Mr William Armyn, who with his father in their jorny to Buckenham dined at Ketton\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-10", "day": "", "info": "\"Sir Nathaniel went this morning to Mildenhall, Sir Thomas dined with Sir William Armyn &c at Ketton. Giles Barnardiston & I dined there. They rode after dinner, Sir William & Mr Armyn to Buckenham, Sir Thomas to Sir Nathaniel. I came home.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-11", "day": "Friday", "info": "\"I walkt to Ketton in the afternoone. Mr Kemp came home with me & tooke his grey nag out of Aversee wood.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-12", "day": "Saturday", "info": "\"I sent Vine home on horseback & my boy Watt to bring back my nag. An houre after my brother Clopton sent to me & some hazle & oake lipps, which Petit sett for me this day. I payd 5d. the pound for beefe this day at Ketton.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-13", "day": "Sunday", "info": "\"Mr Burrell preacht his former text.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-14", "day": "Monday", "info": "\"Whitson [sic] Monday: Sir Nathaniel, Sir Thomas, cosin Brooke visited me in the morning.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-14", "day": "", "info": "\"I heard the newes the Levellers were devided from the army & had began [sic] to randevous in some places.\"", "category": "News", "color": "#F28C28", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-15", "day": "Tuesday", "info": "\"Sir Thomas, cosin Brooke & I rode to Newmarket fayer. Sir Thomas boute a young chesnut gelding at £20 10s. 0d of one Deede of Cowlinge. I boute a grey gelding that was Mr Lurkin’s of Hundon for £11 7s. 0d.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-16", "day": "Wednesday", "info": "\"I sent my grey gelding to Clare Castle.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-17", "day": "Thursday", "info": "\"Was apoynted a fast day by the parliament but not kept by all, but very few. Mr Burrell preacht 2, his text Hosea 1, 6.\"", "category": "Sermon - weekday (fast day)", "color": "#D64545", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-18", "day": "Friday", "info": "\"I rode with Sir Thomas, cosin Brooke & dined with Giles Barnardiston\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-18", "day": "", "info": "\"Agreed with a carpenter to take down the house I boute of my cosin Barnardiston & sett up 4 roomes for £5 11s. 0d.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-19", "day": "Saturday", "info": "\"Sir Nathaniel came home with me. Sir Thomas, cosin Brooke, with there wives, coming from Thurlow visited me & dranke a sillabub in the yard\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-19", "day": "", "info": "\"We heard the army had routed the Levellers, taken 7 or 800 of them.\"", "category": "News", "color": "#F28C28", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-20", "day": "Sunday", "info": "\"Mr Burrell preacht his text as formerly: ‘The ox knowes his owner.’ \" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-21", "day": "Monday", "info": "\"After dinner I went to Ketton Hall. Sir Nathaniel & Sir Thomas & cosin Brook with their ladies were gone to dinner to Mr Fayrecloth’s. Mr Sp\\phe/henson & his wife were there. They cald & supt with me & rode home after supper. Mr Kemp came up to me & stayd an hour.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-22", "day": "Tuesday", "info": "\"I went to Ketton to take my leave of my cosin Brook but he went not that day. At night came my Lady Rolt & Sir John. Sir Nathaniel & Sir Thomas were at Haverill about justice busines.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-23", "day": "Wednesday", "info": "\"After dinner rode to Clare to order the taking downe of the house I boute there.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-24", "day": "Thursday", "info": "\"Saw my house tooke down\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-25", "day": "Friday", "info": "\"I went in the morning to take leave of my cosin Brooke who, with his wife, went home this day. I dined with him at Ketton Hall\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-25", "day": "", "info": "\"I rode in the afternoon & &[sic] boute 6000 bricks of Driver of Little Bradley.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-26", "day": "Saturday", "info": "\"I had 7 loade of my house at Clare broute by Sir Thomas, Cate, Oynion, Smyth, Reade of Ketton, Prentice of Clare & myne owne cart.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-27", "day": "Sunday", "info": "\"Mr Burrell preacht his old text in the forenoon & the afternoone at Thurlow. We all went to Ketton church with the children. Mr Fayrecloth preacht his text: ‘Simon, Simon, Sathan’ &c. My wife & I supt at the hall.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-28", "day": "Monday", "info": "\"I went to Clare with my owne, Sir Thomas, Cate, Smyth & Oynion’s cart for my house. My man Page was hurt with my cart turning over & over.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-28", "day": "", "info": "\"This day Sir John Rolt & lady went from Ketton. Sir Nathaniel,\nSir Thomas & ladies & Mr Kemp rode a little way with them, wheeld\nabout, dined with Mr Stephenson at Burrough Green & cald on me.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-29", "day": "Tuesday", "info": "\"In the morning my owne, Butcher’s, Cate’s, Smyth’s & Oynion’s cart [sic] fetcht more of my house from Clare. I rode thither.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-30", "day": "Wednesday", "info": "\"I was in the high way with the labourers (being surveighor). My owne cart went for brick to Bradley. I payd 16s. the 1000 for them.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-31", "day": "Thursday", "info": "\"We mended or highways.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-06-01", "day": "Friday", "info": "\"Having apoynted to goe to Clare for the last of my house, Sir Thomas, Mr Sparrow’s & my owne cart & broute all\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-02", "day": "Saturday", "info": "\"My men fetcht bricke.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-03", "day": "Sunday", "info": "\"Mr Burrell being ill we heard Mr Kempe at Little Wratten in the forenoone, at Haverill in the afternoone.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-03", "day": "", "info": "\"Mr Kempe came home & supt with us.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-04", "day": "Monday", "info": "\"I sent my owne cart with Smyth’s for the \\re/sum of Mr Kemp & I rode thither by Halstead, stayd at the Swan 2 houres with Thomas Harvy & Mr Covill, lay this night at the Cock at Brayntre, loaded my stuffe. This day my carpenters came from Clare to set up my house.my household stuffe at Brayntre.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-05", "day": "Tuesday", "info": "\"My carts being gone, Mr Kempe & I after visiting my uncle Mott & some freinds [sic] came home by 9 at night.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-06", "day": "Wednesday", "info": "\"I dined with Sir Thomas.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-06", "day": "", "info": "Sir Thomas and Sir Nathaniel \"came home with me to advise about my building.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-07", "day": "Thursday", "info": "\"At Ketton they kept a fast in order to the sacrament the saboth [sic] following.\"", "category": "Fast day", "color": "#6B7280", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-07", "day": "", "info": "\"My men this day began twifallowing.\" [triple plowing] ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-08", "day": "Friday", "info": "\"In the morning I went to Ketton Hall, the rest of the day attended my carpenters.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-09", "day": "Saturday", "info": "\"I went to Ketton in the morning & boute my beefe & came home. My carpenters had wroute with me a weeke & almost framed my house: went home to Clare this night\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-10", "day": "Sunday", "info": "\"Mr Burrell preacht his old text.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-10", "day": "", "info": "\"My she cosin Farrand, being at or church, came home with me, & stayd about an howre with her children.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-11", "day": "Monday", "info": "\"I rose by 2 or 3 in the morning, sent my cart for lime to Cheveley with Oynion’s alsoe, & my boy with my Newmarket gelding to the fayer but sold him not. I went to Ketton, was there betweene 3 & 4 in the morning, cald Sir Thomas who, with Mr Kemp, went to the fayer.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-11", "day": "", "info": "\"My brother Thomas Clopton came to Ketton by 6 in the morning, went home with me & dined & soe rode to Liston that night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-12", "day": "Tuesday", "info": "\"Thomas Dike dined with me\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-13", "day": "Wednesday", "info": "\"By 4 in the morning Mr Kemp & I rode to Higham, were there before my brother & sister Smyth were up: dined there. After dinner rode to Burfold, saw my brother Marke & new \\w/ife, came away to Higham that night. Unfortunately hurt my brother Marke’s face with my foot alighting of my horse. This night Sir Nathaniel, Sir Thomas, there ladies dined with Giles Barnardiston at Clare, came to Liston to bedd.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-14", "day": "Thursday", "info": "\"Mr Kemp & I came from Higham by 9 in the morning, cald at cosin Thomas Motte of Stoke, found there my brother Marke, stayed with him an houre, came to Liston. The ladies had dined. Sir Nathaniel & Sir Thomas were gone, Sir Nathaniel to old Gurdon, Sir Thomas to Wickhambrook about a reference betwixt Boreman & Duckworth, 2 ministers, one of Hartest the other of Milford. I came away home presently after dinner. My carpenters came againe to me this day. I had a sore fall of my Newmarket gelding this day on Chilton\nHeath.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-15", "day": "Friday", "info": "\"Wright of Barnardiston the macen [mason] came this day to underpin my house. I this day had a hogg well & dead suddenly\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-16", "day": "Saturday", "info": "\"Sir Nathaniel & Sir Thomas were with me in the morning about advising for a stayer case. I payd my carpenters this day to £4 of there 1st bargaine & let them my brew house & house to groundcell & house of office & stayre case for £4. I was at Haverill in the morning & home againe by 7 of clock.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-17", "day": "Sunday", "info": "\"Mr Burrell preacht his old text: ‘The ox’ &c.\" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-18", "day": "Monday", "info": "\"I was wakt in the morning by 4 with newes that 3 of my horses were lost, but at last found them at Withersfield\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-18", "day": "", "info": "\"I went to Ketton likewise in the morning, where was Mr Fayrecloth come to invite Sir Nathaniel, Sir Thomas & ladies to dinner with his brother\nJohn Sorrell at his house this day, which they did. Mr Wollrich & his wife came to Ketton Hall & dined there with Mr Kempe. This day I had 2 trewells at worke in underpining. Sir Thomas rode to Sir William Spring’s.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-19", "day": "Tuesday", "info": "\"In the forenoone my men & Oynion’s cart fetcht brick. This day about 10 of clock the macens began my chymny. Mr Kemp visited me by 5 in the morning. I walkt with him to Mr Owen’s & came home.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-19", "day": "", "info": "\"I was a[t] Ketton in the afternoone. Sir Nathaniel & ladies after came to my house & drank a sillibib.\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-20", "day": "Wednesday", "info": "\"I stayd at home with my workemen.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-21", "day": "Thursday", "info": "\"Sir Thomas visited me. I rode home with him to dinner to a venison pasty. Mr Fayrecloth & his wife dined with us.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-21", "day": "", "info": "Mr Fayrecloth and his wife \"rode after dinner to heare Mr Marshall of\nFinchingfield & Mr Kempe alsoe\" ", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-22", "day": "Friday", "info": "\"Sir Thomas & Lady came about 5 in the morning & brake fast with me. Samuel Ward & Mr Kempe came an houre after\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-22", "day": "", "info": "\"I sent 2 carts to Stoke for brick & came home empty\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-22", "day": "", "info": "\"At this tyme an order came from parliament: the many absent members should give reason why they absented.\" ", "category": "News", "color": "#F28C28", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-23", "day": "Saturday", "info": "\"Mr Kempe, Mr Owen & I went to Haverill in the morning. I boute meat &c, dined at home, went to Ketton in the afternoone.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-24", "day": "Sunday", "info": "\"Mr Burrell preacht his text as before, ‘The ox’ \" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-25", "day": "Monday", "info": "\"I rode by 5 in the morning to Midsomer fayer at Barnwell. James Riseby sold my Lady Barnardiston’s nagg for £6 10s. 0d & my grey gelding boute at Newmarket fayer 6 weeks before for £11 7s. 0d at £9 10s. 0 to Apleford of Dullingham.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-25", "day": "", "info": "\"I came home by 5 or 6 at night, met with Mr Kempe at home.\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-26", "day": "Tuesday", "info": "\"I had 11 or 12 workmen at work, stayd with them, only after dinner went to Ketton, stayed 2 houres & came home\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-26", "day": "", "info": "\"This day Mr Kempe rode to a fast kept by Boreman & Duckworth, being reconciled a weeke or 10 dayes before.\"", "category": "Fast day", "color": "#6B7280", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-27", "day": "Wednesday", "info": "\"I had still 12 workmen at worke besides carts for brick\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-27", "day": "", "info": "\"This day I began to groundcell my kitchin.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-28", "day": "Thursday", "info": "\"The day of thanksgiving apoynted by the parliament for the victory over the Levellers, but kept of very few. My wife & I went not tom church, by reason or house lay open in many places where the carpenters had pulled it down to set up the brewhouse: fayre day.\"", "category": "Thanksgiving", "color": "#27AE60", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-29", "day": "Friday", "info": "\"This afternoone my brewhouse was raysed\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-29", "day": "", "info": "\"Mrs Owen & her husband visited about 8 at night, an houre after Mr Kemp from Ketton Hall, stayed till after 10 & went to their several homes.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-06-30", "day": "Saturday", "info": "\"My carpenters at night went home & I discharged both them & the macens & all my workmen with their wages.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-06"}, {"date": "1649-07-01", "day": "Sunday", "info": "\"Mr Burrell preacht his text, Judges 5, last, the text he had the Thursday before for the thanksgiving for the vistory over the Levellers.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-02", "day": "Monday", "info": "\"Cosin Giles Barnardiston cald me by 10 in the morning. I rode with him to the Bell at Haverill, dined with him, Captain Ward, Robert Sparrow, old Thomas Flanders & 8 or 9 more officers of his regiment at an ordinary of 4s. 6d a man, supt all with young Olders, came home 11 at night. My cosin Barnardiston’s wife & daughter Jemima dined at Ketton, visited my wife, stayed till 8 at night\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-03", "day": "Tuesday", "info": "\"I had my carpenter come to worke & dowlers. I stayed at home in the\nforenoone, rode to Ketton in the afternoone, visited the ladies & came\nhome & let the thatcher a bargaine for £2 13s. 4d.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-04", "day": "Wednesday", "info": "\"My thatcher came to worke, with the rest of my men being about 12\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-05", "day": "Thursday", "info": "\"I rode to Ketton in the morning, stayed with Mr Kemp a quarter of an houre, came home, was with my workmen & heymakers all day.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-06", "day": "Friday", "info": "\"I had many workmen at worke.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-06", "day": "", "info": "\"Sir Thomas & Sir Nathaniel came from London about 7\nat night, broute my sister Mott from Chelmsford with them. They\nwould not sit in the parliament house. Much talke now about the Scotts\ncoming into England & Lord General Cromwell’s goeing into Ireland.\nMr Kempe the night before coming to see me lay with me all night.\"", "category": "News", "color": "#F28C28", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-07", "day": "Saturday", "info": "\"Cosin Giles Barnardiston came from Clare by 5 or 6 in the morning to me, borrowed £50. I rode with him to Ketton, stayed an houre. Sir Nathaniel & Sir Thomas came home with me to see my house in building.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-07", "day": "", "info": "\"I carried hey in the afternoone\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-08", "day": "Sunday", "info": "\"I heard Mr Burrell in the forenoone on his old text, ‘The ox’ &c. In the afternoone my wife & I went to Ketton, heard Mr Fayrecloth preach ‘Simon, Simon &c but I have prayed.’ \" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-09", "day": "Monday", "info": "\"In the morning I rode to Thurlow, paid the smyth £3 19s. 6d for cart strakes &c. I had all my workmen come doweler, thatcher & macen only write [sic].\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-09", "day": "", "info": "\"Sir Nathaniel & Sir Thomas coming from Thurlow at night visited me. I rode home with them & supt at Ketton Hall.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-10", "day": "Tuesday", "info": "\"An extreame hot day, the sun exeedingly scorching as it had bin all this month & cattle in much want of water & pasture, the pastures being\ndried up, & about London the people forc’t togive their cattle hey. The corne extreame short in the stalke.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-10", "day": "", "info": "\"Mr Kempe visited at night, opend his desires to be a suitor to my sister Mary\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-11", "day": "Wednesday", "info": "\"Sir Thomas visited me in the morning, & I him in the afternoone about an houre\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-11", "day": "", "info": "\"Came home to my workmen, having \\had/ 14 or 15 about a fortnight or 3 weeks\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-12", "day": "Thursday", "info": "\"Having soe many workmen I stayd at home.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-13", "day": "Friday", "info": "\"Captain French, Captain Samuel Ward & his wife visited me in the afternoone\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-13", "day": "", "info": "\"I paid Captain French the £3 10s. 0d I ought him of the price of\n\\the/ tript horse\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-14", "day": "Saturday", "info": "\"My macens made an end of my chymny.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-15", "day": "Sunday", "info": "\"I heard Sir William Soame’s chaplyn, one Mr Cocks, at Little Wratten in the morning\" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-15", "day": "", "info": "Clopton invited Sir William Soame’s chaplyn to dinner but he was engaged to wayte on Sir William.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-15", "day": "", "info": "\"At night old Sanctie broute me a letter from Marke from Burfold, another from my brother Smyth from Higham\"", "category": "News", "color": "#F28C28", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-16", "day": "Monday", "info": "\"Goeing downe to Ketton in the morning I met Sir Nathaniel, Sir Thomas & my brother Clopton coming to see me. I went back with\nme [them].\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-16", "day": "", "info": "\"Write my macen this day began to hang my copper.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-17", "day": "Tuesday", "info": "\"My workmen were all at worke this day my cart & Unwyn’s went to Woolpit for brick by 12 in the morning or night before.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-18", "day": "Wednesday", "info": "\"I had 19 or 20 workmen. My carts came from Woolpit with 1000s. brick about 6 in the morning.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-18", "day": "", "info": "\"Sir Nathaniel & Sir Thomas visited me by 8 in the morning, Mr Owen by 8 or 9 at night, new come home with his wife from Walden.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-19", "day": "Thursday", "info": "\"Sir Nathaniel & Sir Thomas visited & dined at Sir William Soame’s. Sir Thomas rode to Cowlinge fayre. Sir Nathaniel visited as he came home.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-19", "day": "", "info": "\"My oven was nealed [fired] with cakes this day for the macens & carpenters & dowlers.\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-19", "day": "", "info": "\"I sold Captain French a bey mare for £7 5s. 0d.\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-20", "day": "Friday", "info": "\"My brother Clopton lay there the night before from Cowlinge fayre. I broke my fast with him, rode with Sir Thomas & him to the fayer, boute nothing.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-20", "day": "", "info": "\"My brother boute a bey colt for £9 3s. 0d, rode home that night.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-21", "day": "Saturday", "info": "\"Sir Nathaniel & Sir Thomas came & carryed my wife & I to a venison pasty at Ketton. Wee met brother Clopton & cosin Giles Barnardiston. Brother Clopton rode to the fayer at Cowling the 3d day.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-21", "day": "", "info": "\"My wife & I after we had paid or workmen rode to Liston Hall, met my brother Smyth & sister from Higham\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-21", "day": "", "info": "\"Should have met Mr Kempe out of Norfolke, who should have preacht at\nListon & Foxearth but deceaved us all.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-22", "day": "Sunday", "info": "\"We heard Mr Lumley in the forenoone & Mr Firmyn in the afternoon\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-23", "day": "Monday", "info": "\"My wife & I, having divers workmen at home, came from Liston by 7 in the morning.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-23", "day": "", "info": "\"In the afternoone I went with James Riseby to Hundon to looke of young John Westropp’s horse but boute him not.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-23", "day": "", "info": "\"Sir Nathaniel, Sir Thomas & Ladies after supper visited us.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-24", "day": "Tuesday", "info": "\"My carpenters came to work of my stable & my macens of other rooms. The young joyner from Haverill came to me & tooke\nmy parlor to set up my old waynescott for £1 10s. 0d.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-25", "day": "Wednesday", "info": "\"Boute some board\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-25", "day": "", "info": "\"Sent for my cosin Farrand to the Bell, stayd with him 2 houres & came home & found Sir Nathaniel at my house, whom Sir Thomas & my Lady & Sir Nathaniel his lady cald & they went to Thurlow to dinner & alighted at my house about 7 or 8 at night, stayd an howre or thereabouts\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-26", "day": "Thursday", "info": "\"Sir Nathaniel & Sir Thomas visited me\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-26", "day": "", "info": "\"Never more busy with the carpenters & macens being about finishing. I walkt with them to Mr Owen’s then parted with them.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-27", "day": "Friday", "info": "\"I had my joyner come this day to set up my wainescott, & the macens began to brick my hall with Woolpit brick.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-28", "day": "Saturday", "info": "\"In the morning I went to Ketton to buy meate, stayd at the Hall an howre\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-29", "day": "Sunday", "info": "No church; I rose not till 12 or 1, was very ill & aguish all day.", "category": "Other business", "color": "#82C7E8", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-30", "day": "Monday", "info": "\"Sir Nathaniel visited me 2 or 3 houres in the morning, Sir Thomas at night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-31", "day": "Tuesday", "info": "\"Towards night Sir Nathaniel & Sir Thomas & their ladies visited me.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-07-31", "day": "", "info": "\"I sent this day to Cheveley for lime, broute 44 bushells.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-07"}, {"date": "1649-08-01", "day": "Wednesday", "info": "\"It apoynted by p\\mt/ a fast for Cromwell’s success against the rebells in Ireland (who was then as farr as Bristol goeing to Ireland). Some cald it Cromwell’s fast. Few hereabouts preacht but Mr Burrell, his text ‘Soe let thine enemies perish oh God.’ Text he first made use of at the foregoing thanksgiving for the army’s victory against the Levellers . . . I went to church in the morning.\"", "category": "Fast day", "color": "#6B7280", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-02", "day": "Thursday", "info": "\"Sir Nathaniel & Sir Thomas visited me in the morning. I went home & dined with them. Mr Fayrecloth & his wife visited me in the afternoone.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-02", "day": "", "info": "\"This day I dischargd my dowlers.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-03", "day": "Friday", "info": "\"Sir Thomas & Lady cald on us at 4 of clock towards night in there jorny to Newmarket where Sir William Armyn & Mr William Armyn had sent to meet them in their way to Buckenham. Mr Kempe came about 7 at night out of Norfolke & supt with me, stayd till 10.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-04", "day": "Saturday", "info": "\"Sir Nathaniel & Mr Kempe came up to my house, stayd 2 houres. Mr\nOwen & his wife went to Liston Hall. About 5 at night Sir Thomas\nwith his Lady cald on me from Newmarket, left Sir William & Mr\nArmyn in there jorny to Buckenham.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-05", "day": "Sunday", "info": "\"Mr Burrell preacht. I heard Mr Fayrecloth in the afternoone, his text: ‘Simon, Simon, Sathan hath desired to winnow the’ &c. My wife was not well, & went not to church.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-06", "day": "Monday", "info": "\"My glasier set up my glass.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-06", "day": "", "info": "\"The gelder gelt me a colt, Sir Nathaniel gave me & 2 sowes.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-06", "day": "", "info": "\"About 2 or 3 in the afternoone Mr visited me, stayd till 6 or 7.\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-07", "day": "Tuesday", "info": "\"In the morning I walkt to Ketton Hall.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-08", "day": "Wednesday", "info": "\"Towards night my brother Marke sent his man Henry Feton to me for £300 I ought him to be paid within 10 dayes\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-08", "day": "", "info": "\"Mr Kemp came up at night with my cosins Nathaniel & Jane. A fayre day: Sir Nathaniel visited me in the morning\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-09", "day": "Thursday", "info": "\"I wrote to my brother Marke by 6 in the morning & went to Ketton Hall\"", "category": "News", "color": "#F28C28", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-09", "day": "", "info": "\"Towards night Sir Thomas visited me in his jorny from Bury.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-10", "day": "Friday", "info": "\"Mr Owen visited me in the morning, borrowed 3 bookes of me. He & his wife came from Liston Hall the day before. In the afternoone I walkt to Ketton, met Mr Owen there. Sir Nathaniel, Mr Owen & Mr Kemp came home with me about 5 or 6 at night &c.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-11", "day": "Saturday", "info": "\"By 6 in the morning I rode to Brayntre on Mr Kemp’s nag to talk with my uncle & sister Mary super ardua &c\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-11", "day": "", "info": "\"I came to Liston Hall this night & met Mr Kemp from Ketton on my nag & cosin Henry Whetcroft from Eye.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-12", "day": "Sunday", "info": "\"Mr Kemp preacht in the forenoone at Liston, his text: ‘Not every one that sayth “Lord, Lord”’. In the afternoone at Foxearth his text: ‘What will it profit a man to win the whole world & loose his soule or what’ &c.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-13", "day": "Monday", "info": "\"Mr Kempe & I came, he to Ketton & I to Wratten, home.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-14", "day": "Tuesday", "info": "\"In the morning I walkt to Ketton Hall, stayd 2 houres, came home, set young Living to fell oates for me in Mill field at 2s. 6d the acre, to fell,\nbind & comb\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-14", "day": "", "info": "\"My joyner Cowland wroute with me this day to set up bedds & shelves.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-15", "day": "Wednesday", "info": "\"It was Haverill fayer day but I stirrd not out of doors\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-15", "day": "", "info": "\"In the afternoone Sir Nathaniel & his Lady visited us 2 houres. This day Sarah Bull came to my wife\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-15", "day": "", "info": "\"My brother Clopton, Sir Thomas & Giles Barnardiston boute 19 steers for £20.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-16", "day": "Thursday", "info": "\"Mr Owen visited me after dinner, & Mr Kemp. My wife & I walkt with them to Ketton to see Sir Thomas, & little Thomas who was ill. Sir Thomas had bin ill this day but gott up & went to the fayer to buy more steers.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-16", "day": "", "info": "\"Newes of Jones routing Ormond.\"", "category": "News", "color": "#F28C28", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-17", "day": "Friday", "info": "\"I stayd at home to direct the joyner to set up shelves for my wife.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-17", "day": "", "info": "\"Sir Thomas & Lady came about 6 at night to see us\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-18", "day": "Saturday", "info": "\"I stayd at home with the joyner, who set me up a dresser in my kitchen.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-18", "day": "", "info": "\"Sir Nathaniel visited me in the afternoone\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-18", "day": "", "info": "\"My cosin Coo came to me this night to help me in my harvest.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-19", "day": "Sunday", "info": "\"Mr Burrell preacht his text: ‘A sinful people’ &c.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-20", "day": "Monday", "info": "\"I reapt wheat in Gallow field, the first wheat I ever reapt & carried. My cosin Coo pitcht cart.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-20", "day": "", "info": "\"I had the joyner at work with me this day.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-21", "day": "Tuesday", "info": "\"I rose by 5 & cald my cosin Coo. About 8 we went to Haverill, boute a quarter of beefe at 3s. 0d the stone. I sent Mr Kemp word to meet me there but he mist of us. This day I carried my first bullimong.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-22", "day": "Wednesday", "info": "\"I had 6 reapers in Stanlies, but made not an end.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-22", "day": "", "info": "\"Sir Nathaniel & Sir Thomas & Mr Kemp visited me in the morning.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-22", "day": "", "info": "\"Mr Hickman at night broute me £50 from my brother Alby but I told [counted] it not this night\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-23", "day": "Thursday", "info": "\"I had in the further New Hall field wheat with my 2 acres & halfe. My cosin Coo & I pitcht cart.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-24", "day": "Friday", "info": "\"A fayre & more temperate day & Bartholomew day. I had in 5 or 6 acres of bullimong. My cosin Coo & I pitcht & unpitcht.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-25", "day": "Saturday", "info": "Attended a funeral for Mr Borodell, minister of Bumpstead. \"Mr Marshall this day preacht his funerall sermon.\"", "category": "Sermon - Saturday", "color": "#6B7280", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-25", "day": "", "info": "\"This weeke I had into my barne 10 acres of wheat, of which there was not 5 loade straw, & 16 acres of bullimong, of which there was not above 6 or 7 loade.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-26", "day": "Sunday", "info": "\"A young sc\\h/ollar from Cambridge preacht, his text: ‘Come unto me all yea that are weary.’ \" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-26", "day": "", "info": "\"My joyner & his wife coming to or church from Haverill supt with me.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-27", "day": "Monday", "info": "\"I walkt \\rode/ to Sir Thomas Barnardiston’s & dined there\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-28", "day": "Tuesday", "info": "\"I rode to Ketton in the morning about justice busines concerning the setling a poore woman in or towne\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-28", "day": "", "info": "\"With Cates, cald my cosin Coo at Mr Owen’s, went home to dinner. This day Sir Thomas & Lady rode to Liston & lay there in there way to Chilton to Mr Armyn’s wedding.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-29", "day": "Wednesday", "info": "\"Apoynted by an act of parliament for thanksgiving for Jones’s victory over Ormond in Ireland. Mr Burrell preacht betimes inthe morning, left at 10. Then my cosin Coo, wife & I went to Ketton, heard old Daniel Rogers of Withersfield, whose text was Ephesians 2, 13.\"", "category": "Sermon - weekday (thanksgiving)", "color": "#27AE60", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-29", "day": "", "info": "\"We dined at Ketton with Sir Nathaniel & Lady, where dined Mr\nOwen, his wife, Mrs Cole her sister &c.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-30", "day": "Thursday", "info": "\"I had in 3 last loade of bullimong out of Cock field.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-30", "day": "", "info": "\"Write the macen wroute with me this day & William Greene the knacker.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-31", "day": "Friday", "info": "\"Sir Nathaniel visited me in the morning & I him in the afternoone\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-08-31", "day": "", "info": "\"This day I brickt my kitchen.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-08"}, {"date": "1649-09-01", "day": "Saturday", "info": "\"My macen wroute with me.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-02", "day": "Sunday", "info": "\"Mr Burrell preacht his text: ‘A sinfull people laden with iniquity, a seed of evill doers’ &c.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-03", "day": "Monday", "info": "\"I rode to Ketton Hall, saw Sir Thomas & Lady, who were returned from Mr Armyn’s marriage. Cosin Giles Barnardiston, wife & daughters dined at Ketton Hall, & J. Cole & Nathaniel Ward, the New England minister, & cosin Farrand dined there. Cosin Barnardiston, wife, daughters & the ladies with Sir Thomas visited in \"the afternoone.", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-04", "day": "Tuesday", "info": "\"I paid 3 months to the poore, viz 7s. 3d to Martyne & Wiborow\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-04", "day": "", "info": "\"Write the macen wroute with me\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-04", "day": "", "info": "\"Sir Nathaniel & cosin Nathaniel Barnardiston the marcheant visited me in the afternoone: he came to Ketton this day. Sir Thomas came a little before they went away\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-05", "day": "Wednesday", "info": "\"Mr Kempe visited me by 6 in the morning, stayed 2 howres.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-06", "day": "Thursday", "info": "\"Mr Kemp & cosin Nathaniel Barnardiston visited me at night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-06", "day": "", "info": "\"I was having in barly in Wheatcroft when they came.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-07", "day": "Friday", "info": "\"I had in barly.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-07", "day": "", "info": "\"Mr Kemp came home with me & went home to dinner. After dined [sic] both the knights & ladies visited us, & my cosin Nathaniel & Mr Owen.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-08", "day": "Saturday", "info": "\"I had in all my barly but halfe an acre\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-08", "day": "", "info": "\"I stayed at home all day, only in the morning rode to Haverill to buy meat\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-09", "day": "Sunday", "info": "\"We had Mr Aires of Haverill, his text: ‘But the time of their ignorance God winked at’ &c, Hebrews 9, 35. In the afternoone my wife & I heard Mr Fayrecloth, on his old text: ‘When thou art converted’ &c\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-10", "day": "Monday", "info": "\"Ashwood the carpenter came to me to worke.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-10", "day": "", "info": "\"I rode to Ketton in the afternoone, met cosin Farrand to seale a lease of New Hall feild\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-10", "day": "", "info": "\"Cosin Farrand came home with me. I paid him £6 10s. 0d I ought him.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-11", "day": "Tuesday", "info": "\"I stayd at home\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-12", "day": "Wednesday", "info": "Dined in London ", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-13", "day": "Thursday", "info": "Went to fair ", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-14", "day": "Friday", "info": "\"Went to the fayer. Hoppes were 14s.the hundred & old ones if good\n10s. Sir Thomas ha[d] about 80s.of 6 acres.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-15", "day": "Saturday", "info": "\"My wife & I went to Ketton in the morning to take leave of my brother & sister. We stayd dinner & tooke leave of them, who then rode to Liston. We came home, Mr Kemp with us. Okeby cald on me from the fayer\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-16", "day": "Sunday", "info": "\"Mr Burrell preacht his text, as before: ‘Ah sinfull people laden with iniquity’ &c.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-17", "day": "Monday", "info": "Gathered apples", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-18", "day": "Tuesday", "info": "\"Heard Mr Fayrecloth an howre in preparation to the sacrament the next Lord’s day\" ", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-18", "day": "", "info": "Gathered apples", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-19", "day": "Wednesday", "info": "\"My wife & I went to Haverill, heard old Daniel Rogers of Withersfield preach there, his text: ‘You are brought neare by the blood of Christ.’ \"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-19", "day": "", "info": "\"We dined at my cosin Farrand’s, the lawyer, & Sir Thomas & Lady were there. Sir Thomas about 5 at night visited with Mr Kempe\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-20", "day": "Thursday", "info": "\"Write my macen came to me & brickt my brewhouse & Cowland the joyner of Haverill color’d my wainscot parlour.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-21", "day": "Friday", "info": "\"Stayd at home with my workmen & gathered apples. My folks sew wheat & rye in Red field (mesceline).\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-22", "day": "Saturday", "info": "\"In the morning I went to Ketton Hall, stayd in Mr Kemp’s chamber an houre, saw Sir Thomas, came home. In the afternoone it rayned about 2\nhowres. Mr Owen towards night visited me.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-23", "day": "Sunday", "info": "\"My wife & I rode to Ketton & receaved the sacrament Mr Fayrecloth preacht & administerd the sacrament, his text 1 Corinthians, 11, 29: ‘He that drinks unworthily’ &c.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-23", "day": "", "info": "\"We dined at Ketton Hall: there dined Robert French, old Mrs Ray of Dens[t]on & young Ray & his wife, Robert French his brother in law\"", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-24", "day": "Monday", "info": "Rode to Ketton", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-25", "day": "Tuesday", "info": "\"My men threshed\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-25", "day": "", "info": "\"At night Sir Thomas & Mr Kemp came to see me, having uppon a former invitation dined at Mr Webb’s with Mr Fayrecloth & his wife & John Westrop.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-26", "day": "Wednesday", "info": "\"I began to sow wheat in Maynards field but one beat out presently with the raine & it continued rayning all day.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-27", "day": "Thursday", "info": "\"I went to Ketton Hall, dined with my Lady. When I came Mr Turner, Serjarntt [sic] Turner’s eldest son, with Mr Owen were there, but stayd not dinner. Mr Kempe came to me in the afternoone & Mr Owen, who invited my wife & I to dinner the next day.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-28", "day": "Friday", "info": "\"We dined at Mr Owen’s, mett there my Lady Barnardiston, Mr Kempe & Mr Turner.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-28", "day": "", "info": "\"This day I sew wheat in Maynard’s field.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-29", "day": "Saturday", "info": "\"At night the towne quartered 8 horsemen for want of payment of the taxes. I had two Lincolnshire men, one named Health, the other Totty. They lay with me 2 nights.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-09-30", "day": "Sunday", "info": "\"My troopers went to church. Mr Burrell preacht his text as before, ‘Ah sinfull people laden with iniquity.’\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-09"}, {"date": "1649-10-01", "day": "Monday", "info": "\"I rode to Ketton, visited Sir Thomas, who had a cornet & 2 more with him. Cosin Samuel Ward & one Thaxton, ministerof Dalham, came in, the first tyme I saw cosin Ward since he had the small pox. Cosin Giles Barnardiston came from Clare. I dined with him at Ketton. He rode home, Sir Thomas to Thurlow to see Sir William, I to my house, where Mr Kemp visited me, & Sir Thomas, when dark as he came home.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-02", "day": "Tuesday", "info": "\"Early in the morning I rode to Haverill, my cart followed me. I broute home pale lath, rayle, haire & malt, 6 bushells &c. In the afternoone I gathered apples.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-03", "day": "Wednesday", "info": "\"I rode to Liston, cald at Ketton & stayd 2 or 3 houres at Clare with Major Barnardiston.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-04", "day": "Thursday", "info": "\"Cosin Coo & I dined with Mr Raymond, who then removing to Cambridge\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-04", "day": "", "info": "\"This day we heard the newes of Lord General Cromwell’s taking Tradall in Ireland\"", "category": "News", "color": "#F28C28", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-04", "day": "", "info": "\"This day Sir Thomas, Lady & cosin Giles Barnardiston rode to Newmarket, met Mr William Armyne & his wife, Isaac Apleton, his lady & Lady Allington, lay there two nights.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-05", "day": "Friday", "info": "\"I sew wheat these 3 dayes in Maynard’s field\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-05", "day": "", "info": "\"Mr Firmyn saw me at Liston. I dined there & came home, found my son\nTichbourne very ill, & Mr Kemp there & my neice Betty Clopton.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-06", "day": "Saturday", "info": "\"Mr Kemp visited me & stayd till night, waving [sic] the fayer, where he intended to sell his horse. Sir Thomas & Lady came this night from\nNewmarket.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-07", "day": "Sunday", "info": "\"Mr Burrell preacht, his text as before: ‘Ah sinfull people.’ \" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-07", "day": "", "info": "\"Mrs Burrell came to see my wife after sermon.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-08", "day": "Monday", "info": "\"I went to see Sir Thomas & Lady. \"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-09", "day": "Tuesday", "info": "\"I rode to Ketton, borrowed Sir Thomas his white mare to ride to Brayntre, mett my cosin Coo there, who was come for Betty Clopton,\nthen at my house.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-10", "day": "Wednesday", "info": "\"I rode to Brayntre, got there by 11, heard my cosin Collins preach\"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-10", "day": "", "info": "\"Dined with my uncle, moved my sister Mary with\nK[emp’s] desires\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-10", "day": "", "info": "\"I broute home £20 of the £110 Mrs King left with John Marryon for me me [sic].\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-11", "day": "Thursday", "info": "\"I rode (of Sir Thomas his mare I borrowed of him to Brayntre) to Ketton. Doctor Ede was there, & little Jane was very ill, of a feaver. They feared a pleurisy. I mett my cosin Coo there by 8 in the morning. He came for my neice Betty’s things she left behind her, & went to Liston presently, I to my owne house. Towards night Sir Thomas & Mr Kempe visited me, stayd about an howre.\"", "category": "Family business", "color": "#6B7280", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-12", "day": "Friday", "info": "\"I sew wheat in hither New Hall feild\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-13", "day": "Saturday", "info": "\"I walkt to the butcher at Ketton & boute meat, beefe at 2¾d the pound & porke 4d\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-13", "day": "", "info": "\"I dined with Sir Thomas. Mr Kemp came home with me. We walkt to Mr Owen’s & there I left him.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-14", "day": "Sunday", "info": "\"Mr Burrell preacht his text as before, ‘Ah sinfull people.’\" and in the afternoon \"Mr Fayrecloth preacht his text, ‘When thou art converted strengthen thy brethren.’ His doctrine that God punishes his people, viz. beleevers, severely here when the wicked prosper.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-15", "day": "Monday", "info": "\"My men sew wheat\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-16", "day": "Tuesday", "info": "\"I sent my men to Newmarket, boute wheat for seed at 7s the bushell & malt at 4s. 3d the bushell. I stayd at home all day\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-17", "day": "Wednesday", "info": "\"George Fen paid me £20 of 30. My brother Alby sent a man & a letter to me for £10 of £50 I ought him\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-17", "day": "", "info": "\"This day I sew my last wheat in New Hall feild.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-18", "day": "Thursday", "info": "\"I sent away my brother Alby’s man with £10 & a letter to him, my brother Smyth & my brother Marke.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-18", "day": "", "info": "\"This day I made an end of sowing of wheat, the last in the hither New Hall feild.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-10"}, {"date": "1649-10-19", "day": "Friday", "info": "\"Mr Kemp visited me with the relation of his Brayntre jorny, dined with me. Sir Thomas was at Thurlow meeting. Arthur Barnardiston with his son & Thomas Bradshaw & young Thornton di
