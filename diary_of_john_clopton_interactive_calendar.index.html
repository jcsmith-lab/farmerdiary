: "\"Mr Burrell preacht at Ketton, his text out of of [sic] Hosea 6, 1: ‘Come let us returne to the Lord for he hath torne & he will heale us’ &c.\"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-26", "day": "Thursday", "info": "Mr Fayrecloth \"sent his man to invite my Lady, my wife & I to dinner the next day.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-27", "day": "Friday", "info": "\"Mr Fayrecloth made a feast this day, where dined my Lady Barnardiston junior, Mr Kemp, my wife & I, Robert French & wife, Mr & Mrs Burrell, Mr & Mrs Edwards, Mr & Mrs Westrope & Major Westrope\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-27", "day": "", "info": "\"This day I sent Robinson to Liston Hall for a sadle.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-28", "day": "Saturday", "info": "\"Newmarket fayre & Simon & Jude: Mr Kemp rode to sell his nagg there\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-28", "day": "", "info": "\"Osborne broute home my nag Tripp from Rom Hornchurch this night.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-29", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his wonted text in preparation to the sacrament.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-29", "day": "", "info": "\"Colonel Raynsborow was stabd neare Pomfret.\"", "category": "News", "color": "#F28C28", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-30", "day": "Monday", "info": "\"I rode to Chelmsford, lay there. Jer: Dike was there. Captain Robert Sparrow overtooke me. He rode Engerstone & lay with my brother Smyth at the Crown\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-31", "day": "Tuesday", "info": "\"I rode to Romford, where I found brother Smyth & Captain Sparrow & 2 cittizens. We dined & rode to London.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-11-01", "day": "Wednesday", "info": "\"Captain French came to us in the morning. He & I & Captain Sparrow dined at Westminster this afternoone. It was at an arbitration for Sir Thomas with a fellow, one Jackson, that undertooke to sell hops for him in yeares past & gave him noe account. We ended it & Sir Thomas had £18.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-02", "day": "Thursday", "info": "\"Brother Smyth & I dined with Mr Riddar, & were at the office in the afternoone. The com[mittee] would not let us goe of [sic] & usd\nus over ruggedly.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-03", "day": "Friday", "info": "Clopton and Sir Thomas \"dined with Mr Sutheby & spent the rest of the day at the office. I boute me at London new 1 short coate & dublet & a riding coate, my wife a plush westcoate.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-04", "day": "Saturday", "info": "\"Raynd all day: we stird not much out of or chamber.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-05", "day": "Sunday", "info": "\"We heard Mr Blackmore preach, out of Psalm 124, 1,2,3.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-06", "day": "Monday", "info": "\"Captain Guy & we supt in Cornewell,123 & saw the fire works in Cheapside.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-07", "day": "Tuesday", "info": "\"Fayre & frosty: we stird not much abroad.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-08", "day": "Wednesday", "info": "\"We went to Westminster to the Com[mittee] for Excise, where I heard my brother Clopton was put in for High Sheriff, met Mr William Armyn, rode home to his lodgings & lay there. Was sick with eating oynions.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-09", "day": "Thursday", "info": "\"We came to Chelmsford, lay at the Bell.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-10", "day": "Friday", "info": "\"I came to Ketton. My brother Smyth, stayd at Notley. Sir Thomas, Lady, Mr Kemp were walkt on foot to Clare & lay there.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-11", "day": "Saturday", "info": "\"Sir Thomas & Lady came from Clare.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-12", "day": "Sunday", "info": "\"Mr Fayrecloth preacht still in order to the sacrament.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-13", "day": "Monday", "info": "\"I had things come this day to me that I boute at London.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-13", "day": "", "info": "\"Towards night Mr Kemp & I visited Mr Owen.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-14", "day": "Tuesday", "info": "\"Viewed Dodding’s farme but liked it not. He askt 850 for it, it being not above 5 or £46 per annum.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-15", "day": "Wednesday", "info": "\"I stayd at home all day; my wife was not very well.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-16", "day": "Thursday", "info": "\"My Lady, wife & I, being invited to Blunts Hall to dinner, went. It was his [?]son’s marriage, who broute his wife home the night before.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-17", "day": "Friday", "info": "\"A fayre day \\but misty/: I stayd within; very cold.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-18", "day": "Saturday", "info": "\"A fayre day \\but foggy/: I stayd within; cold.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-19", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his old text in order to the preparation for the sacrament.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-19", "day": "", "info": "Mr Fayrecloth dined at Clopton's home", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-20", "day": "Monday", "info": "\"I visited Mr Firmyn in the afternoone. I went there about a purchase at Roydon but it would not be sold.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-21", "day": "Tuesday", "info": "\"Brother Clopton & I walkt to dinner to my cosin Coo of Ballingdon. Mr Raymond mett us.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-22", "day": "Wednesday", "info": "\"My brothers, I & John Coo dined with Mr Raymond, playd at shovegroat.\"", "category": "Leisure", "color": "#8E44AD", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-22", "day": "", "info": "\"My brother & Mr Raymond swapt, viz: my brother gave him £7 to boot betweene his grey colt & 600 of new hopps.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-23", "day": "Thursday", "info": "\"I had a fitt of an ague, yet went with my brothers & John Coo, mett Mr Raymond at the parsonage of Liston & went downe to Milford Hart, where Mr Roger Carrington126 came up to us.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-24", "day": "Friday", "info": "\"I came to Ketton. John Coo walkt with me to Chilton Street. I found Mr Owen at Ketton Hall, who attended my Lady in my absence.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-25", "day": "Saturday", "info": "\"Old Dodding of Wratten Magna came to me about the sale of his land. I offred him 750; he stood upon 850, & soe we parted.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-26", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his old text. He nor his wife dined not here: his son Samuel was come from Cambridge\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-27", "day": "Monday", "info": "\"This day I saw a remonstrance from the army against the parliament treaty with the king in the Ile of Wight: very high.\"", "category": "News", "color": "#F28C28", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-28", "day": "Tuesday", "info": "\"After dinner I walkt to Mr Owen’s a shooting but he was not at home.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-29", "day": "Wednesday", "info": "\"Fast day: Mr Fayrecloth preacht his text, ‘& you hath he quicquened that were dead in trespasses.’", "category": "Sermon - weekday (fast day)", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-11-30", "day": "Thursday", "info": "\"Colt fayer day: Mr Walford rode to Bury to see some freinds.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-11"}, {"date": "1648-12-01", "day": "Friday", "info": "\"I went downe to Mr Owen’s in the forenoone & sent him to Dodding to bid him £800, came to Mr Owen towards night & found that Dodding would not take it.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-02", "day": "Saturday", "info": "\"I mett Dodding at Mr Owen’s this morning, & misty. He would not take under £850. We parted for about £5 for that tyme.\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-03", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his text as before: Acts 2, 42.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-03", "day": "", "info": "Mr Fayrelcoth and his wife dined at Clopton's house ", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-03", "day": "", "info": "\"The newes was now that it was feared the army would begirt London\"", "category": "News", "color": "#F28C28", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-04", "day": "Monday", "info": "\"I walkt to Mr Owen’s after dinner & soe to Dodding’s, where he & I concluded for his farme, he to have 850, casting in all his seed & tilth. We apoynted to meet at Frank Farrands’s the next morning\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-05", "day": "Tuesday", "info": "\"Mr Owen & I met Dodding at my cosin Farrand’s about or agreement for the land. He broute not his evidence soe that we did nothing.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-06", "day": "Wednesday", "info": "\"My Lady had letters from Sir Nathaniel.Things were like to goe very sad.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-07", "day": "Thursday", "info": "\"Mr Fayrecloth apoynted a fast this day for humiliation in relation to the sacrament, beginning about 12 of clock. His text, ‘God is a spirit & will be worshipt in spirrit & in truth.’ \" ", "category": "Sermon - weekday (fast day)", "color": "#D64545", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-08", "day": "Friday", "info": "\"Sir Thomas & Mr Kempe came home out of Lincolnshire from Cambridge this day, about 12 of clock, having bin gone about 3 weekes & 3 dayes. They came to Osgodby the last Saturday & Sir William Armyn came to them on Monday. Mr Fayrecloth came up this afternoone.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-09", "day": "Saturday", "info": "\"According to apoyntment I mett Dodding at my cosin Farrand’s, but he broute not all his writings\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-09", "day": "", "info": "\"Mr Hickman walkt downe with me. We dined there\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-09", "day": "", "info": "\"As Mr Hickman & I came home on foot we met Sir Nathaniel &\nThomas Wheeler coming from London at Webb’s of Wilsey. The\nnewes was that the army was about 10 or 12000 in London & quartered\nat Whitehall & Westminster Hall & had seazed about 3 or 4 score of\nthe House of Comons.\"", "category": "News", "color": "#F28C28", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-09", "day": "", "info": "\"My cosin Giles Barnardiston senior dined at Ketton Hall this day. He was here when Sir Nathaniel came home.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-10", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his old text: Acts 2, 42. Dined here but not his wife.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-11", "day": "Monday", "info": "\"My cosin Ward & his wife dined here, & Mr Owen who had dined before. My Lady, wife & cosin Ward went downe to Mrs Fayrecloth & Mrs Sherive, big with child.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-12", "day": "Tuesday", "info": "\"Mr Kemp & I in the morning went to Dodding’s & viewed it, stayd there 2 hours & came home to dinner.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-12", "day": "", "info": "\"The army was come into London walls.\"", "category": "News", "color": "#F28C28", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-13", "day": "Wednesday", "info": "\"Mr Roger Thornton, Arthur Barnardiston’s son in law, dined here.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-13", "day": "", "info": "\"Mr Fayrecloth preacht his lecture & text, ‘God is a spirit & they that worship him’ &c. They went home after sermon.\"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-14", "day": "Thursday", "info": "\"My wife & I & Sir Thomas went to Dodding’s. We boute his cowes & carts & hey & other lumber, came not home till night.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-15", "day": "Friday", "info": "\"Mr Owen cald me to goe to Clare but I went not, but to Wratten about Dodding’s busines.\" ", "category": "Personal business", "color": "#6B7280", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-16", "day": "Saturday", "info": "\"I walkt to Liston to dinner & to Mr Raymond’s after dinner & soe to Liston with my brothers & cosin Coo.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-17", "day": "Sunday", "info": "\"I heard Mr Lumley in the forenoone & John Firmyn junior in the afternoone.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-18", "day": "Monday", "info": "\"I was at Mr Lumley’s forenoone & afternonne with my brothers. We playd at [blank].\"", "category": "Leisure", "color": "#8E44AD", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-19", "day": "Tuesday", "info": "\"I came from Liston to Ketton; Sir Nathaniel & Sir Thomas at Thurlow meeting.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-20", "day": "Wednesday", "info": "\"The house was invited to Robert French’s to dinner. Sir Thomas, my Lady, wife & I, Mr Kemp, Mr Fayrecloth, Sherive & their wives, with others, dined there.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-20", "day": "", "info": "\"In the morning I met old Dodding and his son John at Frank Farrand’s, where we completed or bargaine.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-21", "day": "Thursday", "info": "\"I was at Dodding’s in the forenoone [&] Haverill in the afternoone.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-22", "day": "Friday", "info": "\"I payd Webb of Wilsey £74 8s. 0d to redeeme a morgage of Dodding &\nMr Kempe & John Dodding Junior.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-23", "day": "Saturday", "info": "\"I walkt to Dodding’s & soe to Blunts Hall & of Butcher boute 2 seame wheat at 6s. 8d. the bushell & 2 seame barley at 4s. 4d. the bushell.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-24", "day": "Sunday", "info": "\"Mr Fayrecloth preached his former text.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-25", "day": "Monday", "info": "\"Xmas day. Sir Nathaniel & Sir Thomas rode to Sir William Spring’s. My wife & Lady were with Mrs Sherive. Mr Kempe & I walked to Haverill but Wrattens, stayd a little at Mr Owen’s. After super [sic] at Ketton walkt to Mr Fayrecloth’s, supt againe there, stayd till 1 of clock.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-26", "day": "Tuesday", "info": "\"My cosin Farrand came to me to talk with me about Dodding.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-26", "day": "", "info": "\"My cosin Giles Barnardiston dined here\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-27", "day": "Wednesday", "info": "\"Fast day: Mr Burrell preacht, his text John: ‘He hath orne & he can heale us,’ Hosea, Mr Fayrecloth being not well.\"", "category": "Sermon - weekday (fast day)", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-28", "day": "Thursday", "info": "\"I walkt to Dodding’s in the afternoone\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-29", "day": "Friday", "info": "\"William & Martyn Clopton, my nephews, came from their grandfather’s to Ketton & dined there. I walkt after dinner to Liston Hall\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-30", "day": "Saturday", "info": "\"I visited Mr Lumley.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-12-31", "day": "Sunday", "info": "\"I heard Mr Lumley in the forenoone, Mr Firmyn in the afternoon, whose text was ‘& Joseph, dying, gave commandments concerning his bones\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-12"}, {"date": "1648-01-01", "day": "Monday", "info": "\"New Yeare’s day: I lay with Mr Lumley the night before & tooke my horse to meet Frank Farrand at Bury to ask councell about Dodding’s\nevidence, but it rayned so extreamely that having ridd 3 mile I came back againe. My cosin Farrand was there & did the busines for me with Mr Fletcher.", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-02", "day": "Tuesday", "info": "\"I was at parson Lumley’s with cosin Coo.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-03", "day": "Wednesday", "info": "\"Brother William & I visited Mr Firmyn towards night.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-04", "day": "Thursday", "info": "\"Mr Firmyn dined at Liston Hall & stayd me from coming away that day\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-05", "day": "Friday", "info": "\"I came to Ketton before dinner\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-06", "day": "Saturday", "info": "\"Epiphany; a frost: Sir Thomas & I & Captain Sherive dined with Sir William Soame, where I see [sic] Sir Thomas Soame & Mrs Brewster\nthe great heire[ss].\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-07", "day": "Sunday", "info": "\"Mr Fayrecloth preacht about embodying at the sacrament out of the Corinthians\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-08", "day": "Monday", "info": "\"Frank Farrand was with me, apoynted the day of sealing\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-09", "day": "Tuesday", "info": "\"I borrowed Robert French his horse & rode to Mrs King of Halstead, whose husband died a weeke before & ought me £300.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-09", "day": "", "info": "\"I came home that night & found my cosin Arthur Barnardiston & his eldest son Arthur there. As I came home I cald on my cosin Plum who, while I was there was very ill & cryed out & was delivred of a daughter about 5 at night. I came to Ketton about 7\"", "category": "Family business", "color": "#6B7280", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-10", "day": "Wednesday", "info": "\"Mr Fayrecloth’s lecture this morning.\"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-10", "day": "", "info": "\"My brother, who I sent for the day before, came to me & was bound with me to John Dodding senior & junior for the payment of £450 to them the 1 of March after. This afternoone I tooke possession of his house & land & had the writings sealed. Sir Thomas was there & my brother Clopton.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-10", "day": "", "info": "\"This night I boute a black mare of Mr Walford for £5 4s. 0d\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-11", "day": "Thursday", "info": "\"Brother Clopton, Sir Thomas & I went to Dodding’s. William Soame of Hundon & Jack Soames & [?]we dined here.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-11", "day": "", "info": "\"At night I went downe againe to Wratten & hired one Sheldrake [as] day\nman for 5s.the weeke.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-12", "day": "Friday", "info": "\"I went to Wratten & got my man about busines, tooke in the mare I boute of Mr Walford. From there went to Robert French, where I met my brother & Sir Thomas. We all were about bargaining with him for horse[s], cowes, sheepe, but did not then. My brother went home after dinner. I went with Sir Thomas &c. to a meeting at Mr Fayrecloth’s, where after the meeting I boute of Robert French a bey mare, a stone138 colt & browne nag & heape of chaffe for £13 & 26 sheepe for my brother at £3 5s. 0d.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-13", "day": "Saturday", "info": "\"I walkt to Giles Barnardiston to dinner, & soe to Liston Hall\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-14", "day": "Sunday", "info": "\"I heard Mr Lumley & Mr Firmyn in there courses\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-15", "day": "Monday", "info": "\"Intending to goe to Mr Raymond’s, he came & dined at Liston\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-15", "day": "", "info": "\"In the morning I walkt to Mr Big of Glemsford to get £50 he ought me but sped not.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-16", "day": "Tuesday", "info": "\"I rode on Trip to Langham to get mony that Horneby ought me\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-16", "day": "", "info": "\"Cosin Gurnall preacht: his discourse that we were all goeing to heaven or hell.\"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-17", "day": "Wednesday", "info": "\"This day I came to Ketton Hall, found Sir Thomas gone the Monday before to Milton,\nhearing of Mr Rolt’s death.\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-18", "day": "Thursday", "info": "\"In the morning I went to Robert French to fetch my horse & chaffe & had them sent away to Wratten.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-19", "day": "Friday", "info": "\"I was at Dodding’s forenoone & afternoone. My man fetcht chaffe at Robert French’s all day.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-20", "day": "Saturday", "info": "\"I walked to Robert French in the forenoon, about having away my chaffe. He came from Romford that day, had sold £140 worth of land. As I came home mett Mr Fayrecloth, talkt with him an houre in the feilds.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-20", "day": "", "info": "\"Mr Kemp & I after dinner went to my farme [&] came home by Mr Owen’s.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-20", "day": "", "info": "\"This day the king came to London from Windsor to his trial.\"", "category": "News", "color": "#F28C28", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-21", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his text, ‘Soe let a man examine himselfe.’ \" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-22", "day": "Monday", "info": "\"I was at Dodding’s &c.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-23", "day": "Tuesday", "info": "\"Mr Fayrecloth preacht to prepare for the sacrament.\"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-23", "day": "", "info": "\"Arthur broute me £45 from Langham of Thomas Horneby’s bond.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-24", "day": "Wednesday", "info": "\"Cosin John Eden dined with us. After dinner I was with brother William, cosin Coo &c. at Mr Lumley’s.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-25", "day": "Thursday", "info": "\"I came to Ketton. Cosin Coo came within a mile & halfe with me. I boute 2 locks at Clare & stayd there an houre\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-26", "day": "Friday", "info": "\"In the afternoone I went to Dodding’s, & came & cald Goodman Butcher of Blunts Hall, who went with me to Haverill, where I boute harness for a cart horse, plough & collars &c.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-27", "day": "Saturday", "info": "\"My harnes were broute home.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-27", "day": "", "info": "\"Mr Croxon, minister of Cowlinge & one Dearsly [?]2b dined here.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-27", "day": "", "info": "\"This day sentence of death was pronounced against King Charles.\"", "category": "News", "color": "#F28C28", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-28", "day": "Sunday", "info": "\"Mr Fayrecloth preacht. We had a sac[rament]. I but not my wife received.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-28", "day": "", "info": "\"We had newes that the king was broute to his triall in Westminster Hall &c.\"", "category": "News", "color": "#F28C28", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-29", "day": "Monday", "info": "\"I set my man to tumbrell. Sir Thomas came to me & I went with him to his woods but we could not agre for an acre of wood. Cosin Ward & his wife, Mr Pindar & his came to the Hall this afternoone & stayd till night. I walkt downe againto my farme.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-30", "day": "Tuesday", "info": "\"Mr Carew Woolrich dined here.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-30", "day": "", "info": "\"Mr Kemp & I walkt downe to Dodding's. I paid £65 3s. 0d. for stock & household stuff. My cosin Farrand came with the lease. I made Dodding for his £200 he left in my hands. Frank Farrand came home with me. I paid him £2 17s. 0d. for the conveyance, lease & counsel. Thomas Prentice of Poslingford brought/ sent me £2.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-31", "day": "Wednesday", "info": "\"Fast day: Mr Fayrecloth preacht his text, ‘& you hath he quicquened that were dead in trespasses.’ \" ", "category": "Sermon - weekday (fast day)", "color": "#D64545", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-31", "day": "", "info": "\"After sermon I walkt to my farme.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-31", "day": "", "info": "\"A little before super [sic] we had a diurnall: the newes that the king was sentenced to dy.\" ", "category": "News", "color": "#F28C28", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-01-31", "day": "", "info": "\"This night I paid Mr Walford his £5 for my black mare.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-01"}, {"date": "1648-02-01", "day": "Thursday", "info": "\"Mrs Cole of Haverill came hither to dinner & lay here.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-01", "day": "", "info": "\"We had newes this day from London, of King Charles his beheading before\nWhite hall [sic] the Tuesday before.\"", "category": "News", "color": "#F28C28", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-01", "day": "", "info": "\"I was at my farme in the afternoone: Dodding put me up 7 come of bullimong.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-02", "day": "Friday", "info": "\"Candlemas day\"; \"In the afternoone I walkt to my farme, Sir Thomas with me, to see his straw at Wratten that he had of Robert French with his cowes. . . Wheat was now 7s. 6d the bushell, barley 5s the bushell & misceline 6s. 6d, cheese 5d the pound & butter 7d.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-03", "day": "Saturday", "info": "\"Ordered my man to goe to Oynion’s for straw, which I\nboute of Sir Thomas, 1 loade at 15s. I came home & dined & Sir\nThomas & I went to Oynion’s & saw my straw loaded & came home.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-04", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his text: ‘Simon, Simon, Sathan hath desired to have thee that he might winnowe as wheat, but’ &c.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-04", "day": "", "info": "\"We had newes from my patron & I had a letter from him.\"", "category": "News", "color": "#F28C28", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-05", "day": "Monday", "info": "\"I was preparing for Liston & Sir Thomas for Sir William Spring’s but at last we both walkt to Giles Barnardiston’s to Clare Friery, where we came in with dinner into the parlour, stayd 3 houres or more, or discourse about Mr Armyn’s match with Mrs An Crane.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-05", "day": "", "info": "\"This night Casbot broute me 2 lettrs, one from my brother Mark, another from Mr Ellis.\"", "category": "News", "color": "#F28C28", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-05", "day": "", "info": "\"I had some treaty with cosin Barnardiston about buying the wing of his house but agreed not.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-06", "day": "Tuesday", "info": "\"I was at Wratten fore & afternoone\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-07", "day": "Wednesday", "info": "\"Ash Wedensday\"; \"I was at my farm in the morning\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-07", "day": "", "info": "\"In the afternoone went downe with Sir Thomas & Mr Kemp to the parsonage to reade in Mr Prynne’s speech in the Comons House, concerning the king’s concessions made 3 dayes before the members were secluded. Mr Kemp was 4 houres in reading it yet read not all. It was about 8 at night when we came home.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-08", "day": "Thursday", "info": "\"In the afternoone I went to my farm at Wratten\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-08", "day": "", "info": "\"When I came home at night Mr William Armyn & his brother Michael & one Mr Gardner, a Shropshire gent, was come to Ketton Hall from London, lying at Chelmsford the night before. They broute newes that the House of Lords were voted downe.\"", "category": "News", "color": "#F28C28", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-09", "day": "Friday", "info": "\"Sir Thomas & Mr Michael Armyn rode to John Westrop’s junior & boute 2 steers. Mr William Armyn & I went to catch birds with a dore fall at the barne. In the afternoone I went to my farme & visited Mr Owen, ill of the goute, in my way.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-10", "day": "Saturday", "info": "\"Mr William Armyn & Mr Michael rode to Clare & broute my cosin Giles Barnardiston to dinner.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-10", "day": "", "info": "\"I boute the wing of his house at Clare of him for £30, he to take of the tyles.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-11", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his old text, ‘Simon, Simon, Sathan hath desired’ &c.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-11", "day": "", "info": "\"Mr Fayrecloth dined here.\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-12", "day": "Monday", "info": "\"I walkt to my farme\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-12", "day": "", "info": "\"Sir Thomas, Mr William, Michael Armyn, Mr Gardner & I, my Lady & wife went to Clare to Giles Barnardiston to dinner. There dined alsoe Mr Cook & cosin Plum.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-13", "day": "Tuesday", "info": "\"We supt at the Lion & Mr Dawsons, Sir William Hicks with us. We lay at the Lion, Sir William at the Black Boy.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-14", "day": "Wednesday", "info": "\"Valentine's Day . . . One Mr Banks preacht the lecture. I was not at church.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-14", "day": "", "info": "\"Went to Jo. Derivall’s & met my brother Mott. My brother Mark was not at home but was rode to Mr Dove’s & to Nayland. This night we supt with the comittee, viz: Mr Mathews in the chayre, Sir Thomas Honywood, Carew Mildmay, Jeremy Aylot.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-15", "day": "Thursday", "info": "\"We attended on Sir William Hicks his busines. Abraham Barington was treasurer for the sequestrations.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-15", "day": "", "info": "\"This night Mr William Armyn & I supt with Sir William Hicks.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-16", "day": "Friday", "info": "\"Mr Armyn’s footman, come from Ketton at 12 last night, was with his master by 6 this morning, broute letters to meet Sir Thomas, Giles Barnardiston & Isaac Apleton at Milford Hart by 11. He rode away presently & outrode me. I stayd at Brayntre, gate home to Ketton by 7.\"", "category": "News", "color": "#F28C28", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-17", "day": "Saturday", "info": "\"I went to Dodding’s & after dinner to James Riseby’s & wayed a weigh of cheese at 4d. 0b the pound & soe walkt to Liston\nHall.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-18", "day": "Sunday", "info": "\"I heard Mr Lumley in the forenoone & Firmyn in the afternoon\" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-19", "day": "Monday", "info": "\"Cosin Coo & I walkt to Mr Raymond’s betimes, fetcht £50 of £100 he ought me. He promisd the other next Monday.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-20", "day": "Tuesday", "info": "\"I stayd at Liston Hall all day, sent my cosin Coo to Tyler for mony for me but he gate none.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-21", "day": "Wednesday", "info": "Attended a funeral ", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-22", "day": "Thursday", "info": "\"I sow’d bullimong in the comon feild. I was with them in the morning & likewise in the afternoone, ordering meal to be ground to brew.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-23", "day": "Friday", "info": "\"Thomas Hempstead brewd 4 bushels for me at Wratten. I was there forenoone & afternoone.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-23", "day": "", "info": "\"Cosin Arthur Barnardiston of Hedingham dined here this day & Burrell\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-24", "day": "Saturday", "info": "\"My men went to plough. I sowd bullimong in Mill Field, I was there morning & evening.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-25", "day": "Sunday", "info": "\"Mr Fayrcloth preacht his former text, ‘Symon, Symon’ &c. out of Luke 22, 31\" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-26", "day": "Monday", "info": "\"I rode to Brayntre, met Cates his wagon for my household stuff. Met my brother Marke. He lent me £300 on my bond. He rode home to Chelmsford that night, come that morning from Stoke Nayland.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-26", "day": "", "info": "\"My cosin Coo came this night to the Cock to me. We supt there & lay there. Mr Ellis & Henry Beckwith supt with me.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-27", "day": "Tuesday", "info": "\"The wagon broute home my household stuffe.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-27", "day": "", "info": "\"I brought my daughter behind on my brother Smyth’s bey crop, which\nmy cosin Coo came of. He rode to Liston on my black mare.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-27", "day": "", "info": "\"My wife & I went to Dodding’s & saw or household stuff layd up. I gave 40s. for the loade.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-28", "day": "Wednesday", "info": "\"I rode to Liston where the fast was not kept.\"", "category": "Fast day", "color": "#6B7280", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-02-28", "day": "", "info": "\"Towards night I visited Mr Firmyn Lumley.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-02"}, {"date": "1648-03-01", "day": "Thursday", "info": "\"I rode from Liston to Ketton & broute £100. I this day paid Dodding £450, all the purchase but £200, which I was to keepe in my hands.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-01", "day": "", "info": "\"Mr Walford came from London, broute newes Sir Nathaniel & Sir Thomas would not enter their dissent & soe came downe into Bedforshire, ordred the coach to come to Milton that next weeke.\"", "category": "News", "color": "#F28C28", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-02", "day": "Friday", "info": "\"I went & was all day at my farm. My folks went to plough.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-03", "day": "Saturday", "info": "\"This day I had one of my wennells [weaned calves] I boute of Dodding drownd in the ditch that runs before my house.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-03", "day": "", "info": "\"The assizes at Bury were this week. This night Robert Walgrave\njunior, son to young Sir William Walgrave was condemned there for\nshooting his brother in law.\"", "category": "News", "color": "#F28C28", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-04", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his former text.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-05", "day": "Monday", "info": "\"I sold a browne nagg I had of Robert French & cost me £4 for £2. 10s. 0d.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-06", "day": "Tuesday", "info": "\"I went to my farme & stayd there all day. Petit the gardner & another were felling an elme to make way for a garden plott. I had hop poles come, which I boute of Cates. My folks went to plough in the comon feild cald Mill feild.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-07", "day": "Wednesday", "info": "\"I was all day at my farme. My maids washt there & I had 2 men at work to fell an elme, my folks at plough.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-08", "day": "Thursday", "info": "\"I went to my farme in the morning, had my chymneys swept in the afternoone, went to Frank Farrand to seale another lease to John Dodding junior only & tooke in the former that was made to father & son, came back to my farme, provided for my coming the next day with my wife & children\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-09", "day": "Friday", "info": "\"This day my wife & I removed from Ketton to or owne at Wratten after dinner. Sir Nathaniel, his Lady & Sir [Thomas] came this day to Ketton from my Lady Rolt. I mett them in Wratten Street; Sir Thomas came to the Hall before I came out. Old Sanctie & his wife & daughter in law helpt us home with the children.\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-09", "day": "", "info": "\"This day I heard the earl of Holland, Goring, Capell, Sir John Owen were\ncondemned before the high court of justice at Westminster\" ", "category": "News", "color": "#F28C28", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-10", "day": "Saturday", "info": "\"I stayd at home in the afternoone. Towards night I went to Ketton Hall\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-11", "day": "Sunday", "info": "\"Mr Burrell preacht his text, Isaiah 1, 2: ‘I have broute up children but they have rebelled against me.’ \" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-11", "day": "", "info": "\"I was forc’t to send for a cowleech this day.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-12", "day": "Monday", "info": "\"Mr Owen visited me in the forenoone, goeing towards Thurlow\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-13", "day": "Tuesday", "info": "\"My wife & I dined at Ketton Hall at the baptizing of my cosin Ann. Much company were there. Mr Fayrecloth preacht out of Luke 7, 32.\"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-13", "day": "", "info": "\"Cosin Giles Barnardiston came but stayd not but rode to Newmarket to meet Sir William Armyne & son to go to Buckenham in Norfolk. He told me\nthe newes the Lord Holland, Duke [of] Hamilton & Lord Capell were\nbeheaded the Friday before at Palace Yard.\"", "category": "News", "color": "#F28C28", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-14", "day": "Wednesday", "info": "\"My gardner with 2 men wroute & my self some times. About 11 of clock came Dan Abraham, my brother Clopton’s gardner’s man. I set him to worke likewise.\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-15", "day": "Thursday", "info": "Dined with Sir Nathaniel and Sir Thomas", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-16", "day": "Friday", "info": "\"I walkt with my brothers & cosin Coo to Mr Raymond's to dinner\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-17", "day": "Saturday", "info": "\"I came from Liston in the morning, dined at the Friery.\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-18", "day": "Sunday", "info": "\"The Haverill farrier came to my horse & cowes & drencht them.\"", "category": "Farming - Sunday", "color": "#6B7280", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-18", "day": "", "info": "\"Mr Burrell preacht his former text.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-19", "day": "Monday", "info": "\"I had borne some wood out of my Stanlies.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-20", "day": "Tuesday", "info": "\"At night old Cole shewd me my ground I had not seene.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-21", "day": "Wednesday", "info": "\"This morning James Riseby came & broute me a daple grey nag. I boute him for my cart at £7. 10s.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-22", "day": "Thursday", "info": "\"I was most part of the day imployd about my garden. My folks went to plow & sew bullimong in Cock field. At night I carted subbs I boute of Petit & fetcht a sow I boute of Sir Thomas for 20s\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-23", "day": "Friday", "info": "\"Right of Thurlow, Mr Burrell’s carpenter, righted up some old pale about my courtyard.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-23", "day": "", "info": "\"At night I had a letter from my brother Mark to meet him at Nayland & bring my\ncosin Farrand with him[sic].\"", "category": "News", "color": "#F28C28", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-24", "day": "Saturday", "info": "\"My folks sew bullimong in Wheatcroft. My gardner & carpenter were at worke.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1648-03-24", "day": "", "info": "\"I writt this day to my brother Mark that I would meet him with my cosin Farrand, ordered Robinson to goe on Monday to Chelmsford with the letter.\"", "category": "News", "color": "#F28C28", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1647, "month_key": "1648-03"}, {"date": "1649-03-25", "day": "Sunday", "info": "\"Lady day & \\Easter Sunday/ . . . Mr Burrell preacht his text as before.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-03"}, {"date": "1649-03-26", "day": "Monday", "info": "\"Mr Owen sent me halfe a veale & came with his wife & dined with me. Sir Nathaniel & Sir Thomas, likewise coming accidentally visited me. I entreated to stay, who dined\nwith me.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-03"}, {"date": "1649-03-26", "day": "", "info": "\"I met my neibours at church to chuse officers. They chose me\nsurveighour for the mending the high wayes.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-03"}, {"date": "1649-03-27", "day": "Tuesday", "info": "\"I was at Ketton Hall towards night. Right the carpenter wroute with me. My brother Marke returnd an answer of my letter.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-03"}, {"date": "1649-03-28", "day": "Wednesday", "info": "\"Fast day: I having noe sermon at home heard Mr Fayrecloth preach his text, ‘Simon, Simon, Sathan’ &c. After sermon I rode to Liston.\"", "category": "Sermon - weekday (fast day)", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-03"}, {"date": "1649-03-29", "day": "Thursday", "info": "\"We rode to Stoke, met my brother Mark & soe rode to Mr Dove of Burfold, lay there.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-03"}, {"date": "1649-03-30", "day": "Friday", "info": "\"I visited my brother Smyth & sister, found brother Alby & wife there, rode back to Burfold to bedd.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-03"}, {"date": "1649-03-31", "day": "Saturday", "info": "\"Cosin Farrand & I came home, cald at Stoke Neyland & Liston\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-03"}, {"date": "1649-04-01", "day": "Sunday", "info": "\"Mr Owen preacht, Mr Burrell being at London, his text: ‘Loe, we turne to the Gentiles.’ In the afternoone I & wife went to Ketton, heard Mr Fayrecloth, supt at Ketton & came home.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-02", "day": "Monday", "info": "\"I was at the wood in the morning to chuse my acre, & soe went to Captain Lankford’s & boute his math [crop of hay] & soe to Ketton & boute chaffe & fetcht it with my cart.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-03", "day": "Tuesday", "info": "\"I rode to Mr Stephenson’s of Burrough Green & bought 3 come of seed barly. My folks fetcht it on horseback. I payd 4s. 4d the bushell. I dined there & came home.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-04", "day": "Wednesday", "info": "\"I payd Goodman Barker 10s. for the rate to the poor\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-04", "day": "", "info": "\"It raynd most part of the day. I stayd at home.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-04", "day": "", "info": "\"Thomas Bayly, Sir Thomas his man, grifted [sic] me 9 crab stocks\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-04", "day": "", "info": "\"Sir Nathaniel cald in his way from Thurlow.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-05", "day": "Thursday", "info": "\"My men fetcht bushes out of the wood cald Aversee.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-06", "day": "Friday", "info": "\"Mr Owen visited me.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-06", "day": "", "info": "\"My men fetcht wood out of Stanlies.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-07", "day": "Saturday", "info": "\"I went home towards night & hired one Page of Ditton for 40s. till Michaelmas\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-08", "day": "Sunday", "info": "\"Mr Burrell preacht his text as before: ‘I have broute up children but they have rebelled against me.’\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-09", "day": "Monday", "info": "\"I walkt to Ketton with Mr Kemp but stayd not nor saw any body\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-10", "day": "Tuesday", "info": "\"My folks fallowed. I was all the forenoone with the gardner. After dinner I went to Haverill with Piddingfeild the farrier, who came to look to a\nwennill I had ill. I came home before 6 at night. This day Thomas Bayley came from Ketton Hall & grafted crab stocks for me.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-11", "day": "Wednesday", "info": "\"My wife I were ready to goe for Ketton but the rayne stayd us\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-12", "day": "Thursday", "info": "\"I walkt to Ketton Hall. Mr Thomas Bacon went from them to Cambridge.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-12", "day": "", "info": "Attended a child's funeral in the community ", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-13", "day": "Friday", "info": "\"After dinner I rode to Ketton. Sir Nathaniel & Sir Thomas were rode to Arthur Barnardiston of Hedingham.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-14", "day": "Saturday", "info": "\"I rode to Liston Hall, cald at Ketton & Clare. My boy Walter Simson came to me this day. I agreed to give him 15s. till Michaelmas\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-15", "day": "Sunday", "info": "\"Mr Lumly preacht at Foxearth, Mr Firmyn at Glemsford. We went to Foxearth in the forenoone, to Liston in the afternoone.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-16", "day": "Monday", "info": "\"I sent cosin Coo to Butcher of Hedingham for £60 he ought\nme. My brother & I saw his man Thomas Heard wrastle with Isaac\nBull at Milford. Heard had the better. In the afternoone my brother& I rode to Mr Raymond’s. He paid me £23 10s. 0d he ought me\"", "category": "Personal business", "color": "#6B7280", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-17", "day": "Tuesday", "info": "\"My folks were sowing barly in New Hall feilds.\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-18", "day": "Wednesday", "info": "\"I boute chaff of one Tassell\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-18", "day": "", "info": "\"Broke fast with parson Greete, dined with parson Sendall of Brinkley, from thence to Mr Stephenson, parson of Burrough Green, soe to one Flood’s of Burrough Green & soe home.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-19", "day": "Thursday", "info": "\"The day apoynted by the parliament for a fast but was not kept. After we had supt Mr Stephenson’s daughter Amy & brother & a little son came & lay with us. They had heard Mr Adrian preach (none but he kept the fast).\"", "category": "Sermon - weekday (fast day)", "color": "#D64545", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-20", "day": "Friday", "info": "\"Sir Nathaniel, Sir Thomas, cosin Lucas & I walkt & dined at Sir William Soame’s\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-21", "day": "Saturday", "info": "\"I walkt to Ketton Hall, mett cosin Giles Barnardiston there. He came home with me but went to Ketton to dinner.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-21", "day": "", "info": "\"My men sowd barly this day & before.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-22", "day": "Sunday", "info": "\"Mr Burrell preacht his wonted text.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-23", "day": "Monday", "info": "Bought \"household stuff\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-23", "day": "", "info": "\"Boute a redd cow of Hix for £6 0s. 0d. Sir Nathaniel & Sir Thomas visited me when I was a[t] Withersfield. Sir Nathaniel markt me out 8 trees (a gift).\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-24", "day": "Tuesday", "info": "Clopton's brother dined with him", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-24", "day": "", "info": "\"After dinner my brother boute a browne stone horse of Butcher for £14 10s. 0d.\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-24", "day": "", "info": "\"My wife & I walkt to Mr Gardner of Withersfield & boute old household stuffe.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-24", "day": "", "info": "\"I was sent for thither to Ketton to take my cosin Brook’s £200 he ought\nme.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-25", "day": "Wednesday", "info": "\"Fast day: I heard Mr Kemp at Ketton\"", "category": "Sermon - weekday (fast day)", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-25", "day": "", "info": "\"Mr Owen after supper & his wife visited us.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-26", "day": "Thursday", "info": "\"I walkt to Haverill, met Mr Kempe & Mr Owen. Sir Nathaniel & Sir Thomas sate there about overseers’ rates.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-27", "day": "Friday", "info": "\"I sold in the morning my little grey stone colt to John Meade for £3 10s. 0d. & boute in the afternoone a roane ston’d nagg of James Riseby for £8 10s. 0d.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-28", "day": "Saturday", "info": "\"Mr Kemp & brother William were with me by 6 in the morning, drank phisik beer.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-29", "day": "Sunday", "info": "\"My brother William & Mr Kemp came in the morning to drink some phissike ale with me\"", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-29", "day": "", "info": "\"Mr Burrell preacht his text: ‘The ox knowes his owner& the ass his master’s crib but’ &c.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-29", "day": "", "info": "\"This day we heard that Poyer & Laugharne & Powell cast dice for their lives & the lot fell on Poyer, who was shot &c.\"", "category": "News", "color": "#F28C28", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-04-30", "day": "Monday", "info": "\"Brother/ William & Mr Kemp came downe in the morning for some phisick drink. I rode to Reach fayer with Goodman Butcher, swapt a black mare had of Mr Walton, & boute a bey ston’d colt for £7 10s. 0d. Was taken in a wondrous great storm as I came home. I boute the colt of one of Soham\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1649, "month_key": "1649-04"}, {"date": "1649-05-01", "day": "Tuesday", "info": "\"Sir Nathaniel, brother William & Mr Kempe came before 6 & dranke phisike ale with me. My servants went to May fayer. I visited Ketton towards night, went not to the fayer.\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1649, "month_key": "1649-05"}, {"date": "1649-05-02", "day": "Wednesday", "info": "\"Sir Nathaniel, my brother Cloptons, Mr Kempe drank their morning draught of phisick ale with me by 5 in the morning. Sir Nathaniel went to Sir William Soame. We walkt to Hundon Park to Robert French’s. I payd him 40s. I ought h
