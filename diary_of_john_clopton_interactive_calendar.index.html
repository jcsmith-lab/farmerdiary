<script>const DATA={"records": [{"date": "1648-05-03", "day": "Wednesday", "info": "\"[Incomplete entry] to Avesy Woods to se the [?]colt.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-04", "day": "Thursday", "info": "\"The the [sic] Essex petition went to the parliament.\"", "category": "News", "color": "#F28C28", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-04", "day": "", "info": "\"Mr Owen, Mr Kemp & I visited Robert Webb of B[arnardiston].\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-04", "day": "", "info": "\"Old Write the carpenter was buried that day. Mr Pooly preached.\"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-05", "day": "Friday", "info": "\"We walked out with Sir Nathaniel & Sir Thomas to see his timber feld for repayring of Wratten Hall which was part burnt by the fire that burnt the parsonage 5 weekes before.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-06", "day": "Saturday", "info": "\"Cousin Giles Barnardiston came & dined with us\"", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-07", "day": "Sunday", "info": "\"Mr. Fayrecloth preacht his text: out of Matthew: the wise builder builds his house on a rock the winds come & the rayne &c.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-07", "day": "", "info": "Hosted Robert French & Mr. Westrope; \"much talk about the newes & sodaine turne of things\"", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-08", "day": "Monday", "info": "\"Sir Nathaniel rode for London. Sir Thomas & I rode with him to my cosin Plum’s where he left us. We met there Giles Barnardiston senior,\ndined there & rode to Clare to speake with Thomas Barnardiston about the difference betweene his father & him about settling an estate on him upon marriage. My cosin Giles Barnardiston questioned his leaving his studies. We came home about 8 at night.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-09", "day": "Tuesday", "info": "\"In the afternoon I walk [sic] to see my mare that went in Barn[ard]iston church yard.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-10", "day": "Wednesday", "info": "\"Mr Borodell of Bumpstead preacht old Mr Blackebies funeral sermon, his text: ‘They that honor me I will honor & they that despise me shall be despised.’ \"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-11", "day": "Thursday", "info": "\"I walkt with Mr Owen & his wife to the fayre, heard Mr Boreman preach.\"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-11", "day": "", "info": "\"Dined my cosin Ward’s, where dined Captain Francis French, Captain Robert Sparrow, Mr Pindar &c. Sir Thomas goeing to Bury this morning cald at my cosin Ward’s. I was on foot & came home with him about eight of clock at night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-12", "day": "Friday", "info": "\"Sir Thomas, Mr Kempe & I walkt to see Deeks his farme of Stoke to buy it. I sent Arthur his mare & foale this day by Casboat that he & I swapt for.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-13", "day": "Saturday", "info": "\"Sir Thomas was raysd by a letter from Mr Chaplyn of Bury certifying that the\nmutiny waxt greater begun on Thursday night before. Sir Thomas rode\nto Thurlow, ordered his company to meet him at Chedbur[gh] Grene\nthe next morning. Mr Clarke came to Mr Fayrecloth in the morning &\ntold him the newes, that Colonel Blague was with them & they had got\nthe magazeene. Messengers were sent to give notice about the country\n&c. Sir Thomas came from Thurlow after dinner.\"", "category": "News", "color": "#F28C28", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-14", "day": "Sunday", "info": "\"Mr. Fayrecloth preacht: his text was concerning him that built on the sand & him that built on the rocke.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-14", "day": "", "info": "\"After evening prayer Mr. Fayrecloth told us he had received letters that the towne was like to be delivered to them & that Col Blague was gone, there being 7 or 8 troopers come & begirt the towne.\" ", "category": "News", "color": "#F28C28", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-15", "day": "Monday", "info": "\"Mr Kempe & I rode to Bury, came in about 12 at noone with Sir Thomas, M[ajor] Desborow & their soldiers, to whom the towne on composition was yielded. The committee sate that after-noone & despatcht a messenger with the newes to the parliament.\"", "category": "News", "color": "#F28C28", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-15", "day": "", "info": "\"I boute me a short coat & put it out to making.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-15", "day": "", "info": "\"This night I supt with Sir Thomas.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-16", "day": "Tuesday", "info": "\"Arthur & I left Bury & rode to Liston\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-17", "day": "Wednesday", "info": "\"I stayd at Liston, visited Mr Firmyn, & Mr Lumley, where we playd at shovegroat.\"", "category": "Leisure", "color": "#8E44AD", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-18", "day": "Thursday", "info": "\"After dinner I rode to my cosin Mott’s of Stoke, lay there all night. One Mr Warren, parson of Layham lay there.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-19", "day": "Friday", "info": "\"Mr Warren & I rode to Horsely to see a farme of £16 per annum of Mr Hull’s to be sold but did not agree.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-19", "day": "", "info": "\"My cosins Mott & Ward rode with me to Mr Kerridge the high sheriff about hiring a house of him but likt it not.\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-20", "day": "Saturday", "info": "\"Dick Sparrow broute me home a white dublet & [?]hose to them. I\nput them on & came to Ketton [that] night.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-21", "day": "Sunday", "info": "\"Mr. Fayrecloth preacht his subject the sandy builder & he that built on the rock: Whitsun\" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-22", "day": "Monday", "info": "\"A very fayre day: Mr Kemp [& I] walkt to Mr Owen’s & they came up to the hall to dinner. He & I & Mr Kempe playd at boules in the afternoone.\"", "category": "Leisure", "color": "#8E44AD", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-23", "day": "Tuesday", "info": "\"Mr Kempe & I in the afternoone walkt to Mr Owen’s, playd at scayles\"", "category": "Leisure", "color": "#8E44AD", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-24", "day": "Wednesday", "info": "\"Mr. Fayrecloth preacht his lecture\"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-24", "day": "", "info": "\"This week began great risings in Kent, surprising Rochester: reported they were 1000 strong\" ", "category": "News", "color": "#F28C28", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-25", "day": "Thursday", "info": "\"My cosin Blos the bayliff of Eye was broute for siding with the mutiniers at Eye. I spake for him to Sir Thomas. After much adoe got him releast on baile, & that he should resign his office\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-26", "day": "Friday", "info": "\"Sir Thomas & I came home.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-27", "day": "Saturday", "info": "A visit from \"a trooper from Bury about the business of the army\"", "category": "News", "color": "#F28C28", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-28", "day": "Sunday", "info": "\"Mr. Fayrecloth preacht his text about the sandy builder & him that built on a rocke.\" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-29", "day": "Monday", "info": "\"My wife & I dined with Mr Martyn Sparrow of Birdbrooke. Sir Thomas lent us a horse. Captain Laurence of Clare supt here this night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-30", "day": "Tuesday", "info": "\"Sir Thomas & I went in the coach for to Sir William Soame & dined.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-30", "day": "", "info": "\"After dinner came letters from London from the comittee at Darby House for a meeting to set the kingdom in a posture of defence as alsoe newes of the great mutiny in Kent & hope to apease it & that the mock prince that said he was Prince Charles was broute from Sandwitch to London\"", "category": "News", "color": "#F28C28", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-05-31", "day": "Wednesday", "info": "\"There preacht at Ketton Mr [blank] his text concerning being dead in sins & trespasses out of the Ephesians\"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-05"}, {"date": "1648-06-01", "day": "Thursday", "info": "\"Mr Kempe & I walkt downe to Mr Owen’s & playd at scayles.\"", "category": "Leisure", "color": "#8E44AD", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-01", "day": "", "info": "\"Sir Thomas sent 3 of his men this night to Newmarket to help surprise 7 or 8 of the malignants that were in Bury, who surrendered.\" ", "category": "News", "color": "#F28C28", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-02", "day": "Friday", "info": "\"Sir Thomas's men returnd from Newmarket about 3 in the afternoone, brought word they took one Captain Paris and Captain Johnson. Paris they sent to the headquarters, Johnson to Bury\" ", "category": "News", "color": "#F28C28", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-03", "day": "Saturday", "info": "\"A letching [leaching] day\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-03", "day": "", "info": "\"This afternoon we had news that the day before was a meeting at Chelmsford where the royall party imprisond the honest, & that they the county was risen by way of posture of defence on word that Kent was 14,000 strong & had got Rochester &c.\" ", "category": "News", "color": "#F28C28", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-04", "day": "Sunday", "info": "\"Mr. Fayrecloth preacht about him that built on the rocke & him that built on the sand\"; Captain Sparrow & Ensigne Proctor attended church", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-05", "day": "Monday", "info": "\"This night we received news from Chelmsford that the county of Essex put up a petition to the committee for to second their former petition & kept the committee in town till they had an answer from the parliament\" ", "category": "News", "color": "#F28C28", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-06", "day": "Tuesday", "info": "\"We had news towards night that Essex was in all condition that many were risen, had drawen up Bow bridge & Goring to be amongst them & 500 horse with them & that many from diverse towns came to them, that the parliament answer did not please them. Towards night when Mr Kemp & I came from James Riseby's Mr Webb's where we had bin we heard the busines was worse. Mr Mead of Finchfield came to Mr Fayrecloth's & told it. We walkt downe to Mr Fayrecloth after supper & sent to Sir William Soame's, having heard that Goring was this night to be at Walden. Sir William sent us more comfortable newes of the defeat at Maydstone by Sir Thomas Fairfax to the Kentish men.\"", "category": "News", "color": "#F28C28", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-07", "day": "Wednesday", "info": "\"I walkt to Mr Fayrecloth after dinner for newes. His son Samuel was come home & brought newes from Cambridge that the sophisters felt one day before about malignant speeches made in the school. My wife, I, Mr Kempe, & Cosin Peg Barnardiston walkt to Mr Owen's, who was gone to Walden & late at night sent us newes the Essex men had an ordinance of indemnity sent them downe.\"", "category": "News", "color": "#F28C28", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-08", "day": "Thursday", "info": "\"Sir Thomas came home this night, brought newes that he had taken Sir John Peyton at Bury & sent him up to London. Sir John Peyton was a chief man in the Kentish rebellion.\" ", "category": "News", "color": "#F28C28", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-08", "day": "", "info": "\"Mr Kemp & I this afternoone walkt to Stoke to see to buy a nag, came home by [illeg.] Wixoe, but boute none.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-09", "day": "Friday", "info": "\"In the morning Captain Robert Sparrow brought an alarm in a letter from B. Gurdon that Goring was returned from Bow & had plundered Burntwood & was come to Chelmsford. Mr Newton brought word they had plundered Thaxted the night before.\" \"Scouts were sent out to Hedingham ward to heare the newes\" \"We all sat up but Mrs Sherive & Cousin Peg only lay down on our beds\" ", "category": "News", "color": "#F28C28", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-10", "day": "Saturday", "info": "\"Having passed the night with little rest, my Lady, wife, Cosin Peg Barnardiston, I & Mr Kemp & Mr Walford rode towards Liston Hall for  security, but considering further stayed at Goodwife Smyth's at Hundon\"; Mr Walford \"brought news that Smyth of Radwinter had taken Captain Perry's company where he was with them but thought that went & that there were about 40 horse there.\" \"Presently, we had letters from Sir Thomas then at Sudbury by Tricker, of there intelligence that Goring & Lucas had come to Rayne Comon with some forces, that Whalley was within a mile of Chelmsford, that Sir Thomas Honywood & his company in Coxall were 160 horse & 1000 foot. Captain Ward with Sir Thomas's company & Captain Robert Sparrow with his auxiliary horse lay at Bathan Bridge. We all went to bed this night & slept, only Tricker scouted out to Haverill side.\" ", "category": "News", "color": "#F28C28", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-11", "day": "Sunday", "info": "\"Mr Fayrecloth preacht this morning about the foundation of a Xian on a rock, his old text.\" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-11", "day": "", "info": "\"After dinner heard Brayntre was posest by the enemy, & upon that Sir Thomas wrote to Mr Fayrecloth to stir up the people & other townes to righte for it was thought the enemy must fight or flee & his his flight by places might plunder.\" \"About 4 at night Mr Fayrecloth's man came from Linton & brought news that was plundered by the Cabbs. About 60 of Ketton went armed Bathan Bridge this afternoon. We had no sermon.\" \"Mr Fayrecloth rode towards night to Bathan & brought news all Goring's forces were in Brayntre & Bocken. Some of Captain Sparrow's men fired on them on Bocken Bridge. Mr Fayrecloth thinking it not secure to stay at\nhome, my Lady, wife, Cosin Peg Barnardiston, I & Mr Kempe rode to\nold Fincham’s of Liston Hall betweene 9 & 10 this night.\"", "category": "News", "color": "#F28C28", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-12", "day": "Monday", "info": "\"Sir Thomas his man came from Sudbury [to] my Lady with newes that the enemy were for certayne at Brayntre, that some army troopes were come in to Sir Thomas Honywood at Cogshall. Mr Kempe & I [after] dinner rode to Ketton, found [none] there to heare newes; from thence we came to Bathan. Some little before we got thither we mett Mr Fayrecloth, who told us scouts came there in with newes that the enemy was gone to Colchester, had plundred Halsted. About 9 or 10 this night we had letters from Sir Thomas agayne &c.\"", "category": "News", "color": "#F28C28", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-13", "day": "Tuesday", "info": "\"This morning John Hawksworth, my Lady’s man, came with a letter from Captain Sparrowe at Bathan, that Whalley with his horse were got Colchester before the enemy, & that General Fairfax was come into Coxall last night. We came this morning from Fincham’s to Ketton & received newes from Sir Thomas that the enemy were in & about Colchester. About 9 or 10 at night we heard that James Renalds had taken his brother’s house at Couples & was there with 300 men. We sent Goodman Frost to Haverill. He broute word he was there with his foote company & 30 horse. Betweene 11 & 12 at night we had letters from Sir Thomas that the enemy was in Colchester, that they at Sudbury were securing the bridges, Cataway & every land bridge, & hoped to get the enemy in a pound.\"", "category": "News", "color": "#F28C28", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-14", "day": "Wednesday", "info": "\"When we had dined came newes that General Fairfax had fought with a party of the enemy out of Colchester & had taken 500 & that Captain Laurence, Mr Cutts his son in law was either dead or mortally wounded. Mr Kemp & James Riseby rode to Couples ward to heare newes. As soone as they were gone came in a man from Haverill & told us they were many foot men in [?]company & plundred & that looked to be 1000 ere night & to be in Haverill.\"", "category": "News", "color": "#F28C28", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-15", "day": "Thursday", "info": "\"Brother Clopton, Mr Kemp & I rode to Buers, to Sir Thomas Barnardiston, where most of his regiment lay, & a troope of the army. There was broute in one Sir Barnaby Scudamore, Mr Sanders & Colonel Samuel Thornton, & one Mr Stuard, all sent from there to Lexden to the headquarters of the generall.\"", "category": "Local travel", "color": "#6B7280", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-16", "day": "Friday", "info": "\"Mr Kempe rode to Ketton, broute a grey nag I had boute of Sir Thomas, which he boute of a trooper, but I let Sir Thomas\nhave him againe\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-16", "day": "", "info": "\"\"Mr Wood of Milford, the parson, & his wife dined here this day.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-17", "day": "Saturday", "info": "\"Mr Kemp & I rode to Milford &c.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-18", "day": "Sunday", "info": "\"Mr Woods of Milford preacht, & Mr Kempe preacht for him at Milford\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-18", "day": "", "info": "\"Sir Thomas was sent for by General Fairfax. I rode with him to Nayland after sermon. We lay at Mrs Goodwin’s, Colonel Gurdon’s quarters. The collonells & other officers in towne were Sir Thomas Gurdon, Colonel Scroope, Colonel Fothergill, Major Westrope, Captain Moody &c.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-19", "day": "Monday", "info": "\"The towne of Colchester yet heild out.\"", "category": "News", "color": "#F28C28", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-20", "day": "Tuesday", "info": "\"Mr Firmyn dined with us at the hall.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-21", "day": "Wednesday", "info": "\"I playd at slide groat at Mr Lumly’s in the morning.\"", "category": "Leisure", "color": "#8E44AD", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-22", "day": "Thursday", "info": "\"Towards night I woke up my lame mare & shod her.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-22", "day": "", "info": "\"Mr Owen dined here this day.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-23", "day": "Friday", "info": "\"I spent most of this day in my study.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-23", "day": "", "info": "\"Sir Thomas being gone to London many letters came for his returne to his soldjers from Captain Ward & Major Barnardiston.\"", "category": "News", "color": "#F28C28", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-24", "day": "Saturday", "info": "\"Came home & read in Sir Walter Rawleigh an howre\" ", "category": "Leisure", "color": "#8E44AD", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-25", "day": "Sunday", "info": "\"Mr Burrell of Little Wratten preached here, Mr Fayrecloth being at London, his text 56 Psalm 5, 6. In the afternoone preached Nathaniel Fayrecloth, Mr Fayrecloth’s 2nd son his text.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-26", "day": "Monday", "info": "\" I redd much Sir Walter Rawleigh’s History of the World.\"", "category": "Leisure", "color": "#8E44AD", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-27", "day": "Tuesday", "info": "\"Mr Burrell preacht this afternoone at Mr Westlies child’s buriall, his text ‘I shall goe to that but that shall not come to me.’ \"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-28", "day": "Wednesday", "info": "\"Nathaniel Fayrecloth preached, his text: ‘Nevertheless thy will be done.’ He made a very excellent sermon.\"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-29", "day": "Thursday", "info": "\"Mr Kempe & I went downe to his house with him & soe to Goodman Hasted’s to looke on a horse.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-06-30", "day": "Friday", "info": "\"My old Lady & young Lady visited Mr Westly and his wife at the parsonage. I wayted on them. It\nwas to comfort him after the death of his child.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-06"}, {"date": "1648-07-01", "day": "Saturday", "info": "\"Cosin Arthur Barnardiston’s man was here at Ketton, came yesternight from the leaguer, broute newes the lord Capel’s son was taken. They in\nColchester were quiet.\"", "category": "News", "color": "#F28C28", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-02", "day": "Sunday", "info": "\"Old Mr Fayrecloth being not come from London home but at the leaguer, his son Nathaniel preacht his text out of the Canticles: ‘Who is she that lookes out fayre as the moone, cleare as the sun, terible as an army with banners.' \" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "2648-07-03", "day": "Monday", "info": "\"Mr Kemp & I walkt to Mr Owen’s in the afternoone, playd at bowles.\"", "category": "Leisure", "color": "#8E44AD", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 2648, "month_key": "2648-07"}, {"date": "2648-07-03", "day": "", "info": "\"Tricker came [at] night from the Suffolk forces before Colchester, broute newes that Friday before a party in the towne issued out & were beaten in by\nSuffolk forces. There was some of them hurt. Sir Thomas was then at\nWormingford sick of the winde cholicke. Mr Fayrecloth came from\nChelmsford this night. This day the parliament men of Suffolk met [in]\ncomittee at Hadly.\"", "category": "News", "color": "#F28C28", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 2648, "month_key": "2648-07"}, {"date": "1648-07-04", "day": "Tuesday", "info": "\"My wife & I had apoynted to goe to Brayntre, but Mr Kemp’s mare lent to the bayly & he not come we stayd another day for Mr Kemp.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-05", "day": "Wednesday", "info": "\"This morning a party in Colchester issued out on Suffolk side: it was reported that Suffolk lost 400 men, but lost none but tooke 80 prisoners, one of them Sir Robert Weston’s eldest son.\"", "category": "News", "color": "#F28C28", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-06", "day": "Thursday", "info": "\"We supt at the Cocke & a Warwickshire gentleman with us, a stranger in the inn.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-07", "day": "Friday", "info": "\"After visiting Mr Draper we came away about 3, stayd at Hedingham halfe an houre & came home by 8 of clocke.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-08", "day": "Saturday", "info": "\"In the afternoon Sir Nathaniel & I walkt on foot to Sir William Soame's\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-08", "day": "", "info": "\"Read the news from London\" ", "category": "News", "color": "#F28C28", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-09", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his text about the builder on the sand & on the rock.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-09", "day": "", "info": "\"Doctor Ede dined with us\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-09", "day": "", "info": "\"We had newes this day that Colonel Lambert had given a defeat to Langdale's forces in the north, & that they had taken Lincolne had their quarters beaten up, as alsoe that some lords (as the duke of Buckingham, Lord Andrew, lord of Holland & Lord Camden were raysing forces for the king about Kingstone. Colchester yet heild out, being well supplied of victuals.\"", "category": "News", "color": "#F28C28", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-10", "day": "Monday", "info": "\"Mr Burrell preacht here a funeral sermon for Goodwife Fitch that died after she was delivered of 2 children. His text was about Phineas's wife dying in bed after she heard that her husband & Eli were dead & the arke of God taken. We heard a rumor this day of great commotions in the city of London.\" ", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-11", "day": "Tuesday", "info": "\"Sir Thomas & I in the afternoone walkt to Mr Owen’s & to Great\nWratten about veiwing Dodding’s farme then to be sold.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-11", "day": "", "info": "\"This night we had newes of the duke of Buckingham, lord of Holland & other lords & gentlemen at St Edes defeated by Captain Robert Sparrow & some of Colonel Scroope's regiment. The soldjers had the richest prize that ever they mett withall.\" ", "category": "News", "color": "#F28C28", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-12", "day": "Wednesday", "info": "\"Mr Allot & wife of Thirlow Major dined here\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-12", "day": "", "info": "\"After dinner, Mr Woods parson of Milford, called here with 7 or 8 of his neighbors in his journey to Lenton his old living in Lincolnshire. They rode to Cambridge that night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-12", "day": "", "info": "\"Mr Fayrecloth preacht his lecture, his text about the sandy builder & him that built on the rock.\" ", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-12", "day": "", "info": "\"More certain intelligence came of the lords' defeat by 2 troopers that were in the fight, viz. Olders his sons of Haverill\" ", "category": "News", "color": "#F28C28", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-13", "day": "Thursday", "info": "\"Walkt with Sir Nathaniel & Lady in the morning. Mr Cooke & his son Woods dined here.\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-13", "day": "", "info": "\"Mr Westly's eldest son John was buried this day. Nathaniel Fayrecloth preacht, hsi text: 'For me to live is & to die is gayne.\"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-14", "day": "Friday", "info": "\"I rose, walkt with Sir Thomas to Mr Fayrecloth's\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-14", "day": "", "info": "\"This day my Lord of Holland & divers prisoners came through Haverill with Captain Robert Sparrow, who carried them to the leaguer at Colchester.\" ", "category": "News", "color": "#F28C28", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-15", "day": "Saturday", "info": "\"Sir Thomas & Sir Nathaniel rode to Thurlow about justice business, viz. providing for the poor, corne being very deare & by reason Colchester was beleaguered & trade of clothing dead, work scarce. Wheat was at 9s, misline at 6, barley at 4s the bushell.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-15", "day": "", "info": "\"Sir Thomas this morning turned away his falconer Tricker for staying drinking all the day before at Haverill\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-15", "day": "", "info": "\"Mr Kempe & I walkt to Mr Owen in the afternoone, playd at scayles.\" ", "category": "Leisure", "color": "#8E44AD", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-15", "day": "", "info": "\"We had newes this day that Suffolk forces had taken the Hive at Colchester with divers prisoners.\"", "category": "News", "color": "#F28C28", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-16", "day": "Sunday", "info": "\"My Fayrecloth preacht his former text: the sandy builder & him that built on the rock.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-17", "day": "Monday", "info": "\"In the afternoone Sir Thomas & I rode to Dodding’s farme, spake with him\nabout the sale of it, but he was not resolved to sell then.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-17", "day": "", "info": "\"My cosin Samuel Ward writt me a letter from the leaguer before Colchester: in it the newes of the taking the Hive the Saturday before, & the enemies\nburning many houses & the taking my Lord Lucas his house.\"", "category": "News", "color": "#F28C28", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-18", "day": "Tuesday", "info": "\"Sir Nathaniel & I walking in the church field, Mr Fayrecloth, who then\nrode to Bury to preach the lecture next day, told us newes that Colonel\nCromwell was at Norhampton with 10000 men & sent for order to the\ngeneral whither to march, that Pembrooke Castle was surrendred on\nmercy, that Goring had burnt another part of the suburbs of Colchester\n& comitted Sir Charles Lucas for oposing him in it.\"", "category": "News", "color": "#F28C28", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-19", "day": "Wednesday", "info": "\"My brother Clopton dined at Ketton & after dinner he & I & Mr Kemp rode to Cowlinge to the colt fayer, an extreame dirt jorny\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-20", "day": "Thursday", "info": "\"I rode not to the fayer for the fowle way.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-21", "day": "Friday", "info": "\"I rode with my brother Clopton to Birdbrooke, dined with him at his father Sparrow’s & parted\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-22", "day": "Saturday", "info": "\"Mr Armyn, Cave, Kemp & I playd at scayles in the afternoone, & towards night rode out to take the ayre.\"", "category": "Leisure", "color": "#8E44AD", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-23", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his text as before\" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-23", "day": "", "info": "\"The Scotts being now come into England Cromwell was gone to opose them\"", "category": "News", "color": "#F28C28", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-24", "day": "Monday", "info": "\"Mr Armyn, Mr William Cave & [I] rode to Ipswitch, lay at Mrs Corries the King’s Head, stayd at Lanham halfe an houre, wrote to Major\nBarnardiston to meet us at Ipswitch.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-25", "day": "Tuesday", "info": "\"Mr Isaac & Robert Apleton dined with us\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-25", "day": "", "info": "\"The comittee sate at Ipswitch: newes came that the 14 revolted ships were on the coast of Yarmouth but the towne would admit of noe force on either side. This morning Mr Armyn was examined by 6 troopers in his bedd: showed the Speaker’s pass, which satisfied.\"", "category": "News", "color": "#F28C28", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-26", "day": "Wednesday", "info": "\"Fast day: we traveld to Nayland, heard noe sermon\"", "category": "Fast Day", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-26", "day": "", "info": "\"Met Giles Barnardiston, the 2 Apletons & dined at the Crowne with a venison pasty &c.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-26", "day": "", "info": "\"We heard that there had bin a skirmish with the Scotts by Colonel Harison.\"", "category": "News", "color": "#F28C28", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-27", "day": "Thursday", "info": "\"I heard Mr Firmyn preach at Mrs Cosin’s funerall, his text ‘Whether we live we live to the Lord &c. Whether we live or die we are the Lord’s.’ \"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-27", "day": "", "info": "\"I dined with my brother & sister &c. at Mr Cosin’s & came to Ketton where I [found] my cosin Nathaniel Barnardiston with his wife & Mrs Bacon her mother\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-28", "day": "Friday", "info": "\"This morning I lent old Dodding £7.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-29", "day": "Saturday", "info": "\"I stayd at home & in the afternoone sent for July 29 things to Clare that were broute from Brayntre for my wife’s lying in.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-30", "day": "Sunday", "info": "\"Mr Fayrecloth preacht this day his former text\" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-31", "day": "Monday", "info": "\"Came to cosin Plum’s, playd at shovegroat & lay there with Sir\nThomas.\"", "category": "Leisure", "color": "#8E44AD", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-07-31", "day": "", "info": "\"I rode to my sister Alby’s at Sible Hedingham. Sir Thomas & Mr Kempe rode to the leaguer before Colchester, but rayning extreamly we lay at my cosin Plum’s at Yeldham Magna. After dinner I rode to see my sisters Alby & Smyth & was wet to the\nskyn\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-07"}, {"date": "1648-08-01", "day": "Tuesday", "info": "\"After breakfast Sir Thomas & Mr Kempe rode to the leaguer & I came to Ketton about 2 of clocke & tooke them at dinner\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-02", "day": "Wednesday", "info": "\"At night came Mr Baconmy cosin Nathaniel Barnardiston’s wives brother, and before him one Mr Wikes, a minister of Areton75 in Suffolk. Sir Nathaniel, Lady & the young Lady Barnardiston & Mr Bacon, cosin Nathaniel & his wife rode in the coach to Thurlow after dinner\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-02", "day": "", "info": "\"This day we heard Scarbourough Castle was revolted from the parliament to the king. This night it rayned till the next morning & made an extreame great flood, such a one as scarce any living remembred at Ketton. Sir Thomas & Mr Kempe came this night from the leaguer.\"", "category": "News", "color": "#F28C28", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-03", "day": "Thursday", "info": "\"Mr Wikes towards night rode to Yeldham to my cosin Plum’s\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-04", "day": "Friday", "info": "\"John Hawksworth came this night out of Lincolnshire, brought my Lady’s nag & Sir Nathaniel’s ball colt that Birt pac’t.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-05", "day": "Saturday", "info": "Hosted Mr Fayrecloth for dinner ", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-06", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his text out of Matthew 7, 24 as formerly. He insisted on perseverance.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-07", "day": "Monday", "info": "\"Captain Hunt St George his 3rd son dined, who married a wife in Wales (rich), & Mr Pindar\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-08", "day": "Tuesday", "info": "\"I, intending for Liston, received a letter from brother Smyth from Hedingham. [He] wrote he had made up or accoun but on very bad terms for us at London, soe that I rode to Hedingham\"", "category": "Personal business", "color": "#6B7280", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-09", "day": "Wednesday", "info": "Rode to the home of someone named Mr. Raymond and spent the night because of the rain", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-10", "day": "Thursday", "info": "\"Mr Raymond came with me to Liston, dined there. My brother Smyth came from Hedingham Sible when we were at dinner, lay at Liston that night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-11", "day": "Friday", "info": "\"Men were glad to take any oportunity to have in there hey, which was most carried away with the extreame floods, some having 20 or 30 loads caried away, and harvest.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-12", "day": "Saturday", "info": "\"Sir Thomas shared [sheared] some of his wheat that was layd &c.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-13", "day": "Sunday", "info": "\"Mr Fayrecloth preacht about the rocky & sandy builder\" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-14", "day": "Monday", "info": "\"Presently after 12 my wife cald me to call Mrs Westrop, which I did, running through the stone yard in my shirt, & after cald some women my selfe & sent for others.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-15", "day": "Tuesday", "info": "\"Just at 2 this morning my \\3rd/ daughter Jane was borne.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-16", "day": "Wednesday", "info": "\"Sir Thomas rode betymes to the fayre at Haverill to see if he could buy the 2nd day but boute noe cattell.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-17", "day": "Thursday", "info": "\"Sir Nathaniel to Haverill with Mr Fayrecloth, to meet Mr Raymond to arbitrate a busines of tythes for Mr Fayrecloth. It was whether Mr Fayrecloth should pay taxes in Essex for tithes in his towne which lay in Sturmer in Essex\"", "category": "Family", "color": "#6B7280", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-17", "day": "", "info": "\"Mr Owen came to me in the afternoone about mony for Dodding of Wratten but I lent none.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-18", "day": "Friday", "info": "\"It rayned 3 houres in the forenoone, which prevented a harvest day.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-18", "day": "", "info": "\"This night at super came a letter from Major Barnardiston from the leaguer, that Colchester sent to treat: if the general would let him send to the king’s party. If releife came not within 20 days they would treat, but the general returned answer he hoped to be in Colchester before that tyme.\"", "category": "News", "color": "#F28C28", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-19", "day": "Saturday", "info": "\"Old Mr Tomson & his son Dick were here\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-19", "day": "", "info": "\"Samuel Ward wrote a letter from the leaguer that the Prince, indeavouring to land men at Deale had 3 or 400 killed.\"", "category": "News", "color": "#F28C28", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-19", "day": "", "info": "\"Sir Thomas set in 12 troopers into his wheat\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-20", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his wonted text\" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-21", "day": "Monday", "info": "\"Sir Thomas with 20 troopers had his wheat in\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-22", "day": "Tuesday", "info": "\"Sir Thomas & Sir Nathaniel being to goe to Cambridge to meet the Comittee for Association resolved for Bedfordshire & got me with them.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-22", "day": "", "info": "\"We had certayne newes of Cromwell’s routing the Scotts, taking 9000\nprisoners &c.\"", "category": "News", "color": "#F28C28", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-23", "day": "Wednesday", "info": "\"We set out about 11 & got Milton [Ernest] by 6 or 7 at night. We met Sir John & my Lady Rolt coming home from a baptizing.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-24", "day": "Thursday", "info": "\"It rayned much & causd a great flood. I stayd within dores\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-25", "day": "Friday", "info": "\"It rayned. I stayd within &c.\"", "category": "Personal business", "color": "#6B7280", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-26", "day": "Saturday", "info": "\"In the afternoone we visited Colonel Harvy at his house\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-27", "day": "Sunday", "info": "\"Mr Watson preacht & dined with us. In the afternoone we rode to Bletsoe & heard their minister.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-28", "day": "Monday", "info": "\"We came home. Sir John & my Lady came to Tempsfeild to the river’s side with us where, my mare casting a shoe, I was cast behind but came home by 9 that night by Cambridge.", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-28", "day": "", "info": "\"This day about 9 of clock in the morning Colchester surrendred to my lord General Fairfax, it being 12 weeks just since the enemy entred into it. By agreement all under captains were to have quarter, the rest to be at mercy. About 6 this night Sir Charles Lucas & Sir George Lisle were shot to death, being two of the principal actors in Colchester.\"", "category": "News", "color": "#F28C28", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-29", "day": "Tuesday", "info": "\"Mr Fayrecloth came from the leaguer this night & broute us the newes. This night about 8 Colonel Far, an Essex gent, was shot to death as then reported but proved otherwise.\"", "category": "News", "color": "#F28C28", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-30", "day": "Wednesday", "info": "\"It was the fast day, which Mr Fayrecloth kept because of the rayne & people could not work for he had told them he would omit it because of harvest.\"", "category": "Fast Day", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-30", "day": "", "info": "\"Mr Fayrecloth’s text was out of the Ephesians: ‘But you hath he quicquened who were dead in trespasses and sins.' \"", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-30", "day": "", "info": "\"This night my cosin Arthur Barnardiston, Sir Nathaniel’s son, came from\nLondon by Colchester, broute the newes that duke Hambleton & Langdale were taken.\"", "category": "News", "color": "#F28C28", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-08-31", "day": "Thursday", "info": "\"I rode with my brother to Liston that night.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-08"}, {"date": "1648-09-01", "day": "Friday", "info": "\"After dinner we 3 brothers & John Coo walkt Mr Raymond's, playd at Shrovegroate. Mr Raymond & I swapt. I had of\nhim a little black nag, a silver hat band, a shagd hat, for my browne mare, and I had in mony £3.\"", "category": "Leisure", "color": "#8E44AD", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-02", "day": "Saturday", "info": "\"I bargaind with John Coo to give me £9 at Michaelmas next for £12 Henry Whetcroft ought me & a silver hatband.\"", "category": "Personal business", "color": "#6B7280", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-03", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his text about the sandy & rocky builder: Matthew 7, 25\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-04", "day": "Monday", "info": "\"My cosin Ward & his wife came to Ketton Hall, & dined there.\" ", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-05", "day": "Tuesday", "info": "\"My uncle Wiseman, being broute prisoner from Colchester to Bathan, sent a letter to Sir Nathaniel & myself to send him £XX for his freedom but we did not. Mr Hickman went to see him. He was angry at or letter.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-06", "day": "Wednesday", "info": "\"At night came 3 troopes of horse by from Yarmouth. Sept. 6 About 30 quartered in Ketton; 4 were sent to the hall. \\Their/ captain,\nHarlackendon, quartered at Mr Fayrecloth’s.\"", "category": "News", "color": "#F28C28", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-07", "day": "Thursday", "info": "\"Thanksgiving day for the victory Cromwell had against the Scotts, & other victories in the north. Mr Fayrecloth preacht his text, 115 Psalm, 1: ‘Not unto us oh Lord’ &c.\" ", "category": "Sermon - weekday", "color": "#D64545", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-08", "day": "Friday", "info": "\"When we were at dinner Mr Carew Woolrich, his wife, daughter & son Danstone & his mayden daughter came in. They had bin to see Colchester, dined here & rode home.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-09", "day": "Saturday", "info": "\"I rested ill the last night, sweat much.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-10", "day": "Sunday", "info": "\"Mr Kempe preached for Mr Fayrecloth, being gone to London. I was not well of my cold but stayd at home. My wife was churcht in the afternoone.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-11", "day": "Monday", "info": "\"Mr Owen dined here. This night Mr Kempe my bedfellow got likewise a cold.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-12", "day": "Tuesday", "info": "\"Captain Robert Sparrow dined here. I was recovering of my cold & rode with Sir Thomas, who carried my Lady to Goodwife Smyth\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-13", "day": "Wednesday", "info": "\"I stayd at home & lookt to a black nag I had prickt.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-14", "day": "Thursday", "info": "\"Sir Thomas, Mr Kemp & I rode to the fayre. I found my brother Mark at the Beare. I supt with him but lay with Sir Thomas at the Angell.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-15", "day": "Friday", "info": "\"My brother Mark rode home to Chelmsford, we to the fayre, where we dined, & lay this night at the Angell at Cambridge.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-16", "day": "Saturday", "info": "\"We all came home to Ketton this night.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-17", "day": "Sunday", "info": "\"Mr Burrell preacht (Mr Fayrecloth being not yet come home), his text: Isaiah 1,1.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-17", "day": "", "info": "\"My little cosin Jane came out with red spots; twas advisd to send for Doctor Ede, but did not, only writt to him the next day.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-18", "day": "Monday", "info": "\"Cosin Giles Barnardiston, Leiutenant Brewster & Thetcher dined here\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-18", "day": "", "info": "\"Mr Fayrecloth came from London (a waring jorny as frequently reported). This day the treaty with the king at the Ile of Wight began at Nuport.\"", "category": "News", "color": "#F28C28", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-18", "day": "", "info": "\"Sir Thomas sent Mr Walford to Bradfeild to take downe his hawke.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-19", "day": "Tuesday", "info": "\"The generall was now at Bury.\"", "category": "News", "color": "#F28C28", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-20", "day": "Wednesday", "info": "\"Walford & Payne came home but could not find the hawke.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-21", "day": "Thursday", "info": "\"Mr Kempe, my wife & I visited Mr Owen in the afternoone\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-22", "day": "Friday", "info": "\"I dined at my cosin Plum’s at Yeldham & lay this night at my sister's\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-23", "day": "Saturday", "info": "\"I lent Mr Fayrecloth £20\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-24", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his text out of 2 Acts 42: ‘And they all continnued [sic] in the Apostles’ doctrine & fellowship & in breaking of bread & prayers. Robert French & his wife dined at Ketton Hall. This sermon was a preparation to the sacrament.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-25", "day": "Monday", "info": "\"My wife & I & Mr Kempe rode to Brayntre fayer\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-25", "day": "", "info": "\"I spake with Mr King about the mony he ought me.\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-26", "day": "Tuesday", "info": "\"We dined at my uncle Mott’s\"", "category": "Social", "color": "#2F80ED", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-26", "day": "", "info": "\"Saw Nan & payd £4 to her nurse\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-27", "day": "Wednesday", "info": "\"Mr Kemp preacht his text, Jeremiah 2, 25: ‘But yo[u]r sins &c' \" ", "category": "Sermon - weekday (fast day)", "color": "#D64545", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-27", "day": "", "info": "\"Some company aftersermon about justice busines\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-28", "day": "Thursday", "info": "\"Mr Owen dined here\"; \"After dinner Mr Owen, Mr Kempe & I walkt to Thurlow Haverill & dranke a pint of wine & came home.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-29", "day": "Friday", "info": "\"Michaelmas day, & fayre: my brother Clopton came from Birdbrooke & dined here,& rode home that night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-29", "day": "", "info": "\"Mr Fayrecloth preacht at Romford a thanksgiving sermon for the comittee men’s deliverance out of Colchester: the thanksgiving was the day before.\"", "category": "Sermon - weekday (thanksgiving)", "color": "#27AE60", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-09-30", "day": "Saturday", "info": "\"I took walking pills\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-09"}, {"date": "1648-10-01", "day": "Sunday", "info": "\"Mr Kemp preacht in Mr Fayrecloth’s absence, who was gone to London .  .  . Mr Kemp's text: ‘Blessed are the poore in spirit.’ \" ", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-02", "day": "Monday", "info": "\"Sir Thomas & I walkt downe with Robert French to look on his bullocks but did not bargaine. He came up to dinner.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-02", "day": "", "info": "\"Mr Pindar dined here.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-03", "day": "Tuesday", "info": "\"It was Sir Thomas’s carting day: the sommer being soe wet he could not fetch home wood before.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-03", "day": "", "info": "\"Sir Thomas rode to Bury to a meeting for the Suffolk forces against Colchester to receave their pay, viz: 16000 given them\"", "category": "News", "color": "#F28C28", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-04", "day": "Wednesday", "info": "\"My cousin Arthur Barnardiston of Hedingham came this night hither from keeping a court at Lanham a court at Lanham, & lay here, & one Mrs Randall, a poore minister’s relict, coming from London, lay here.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-05", "day": "Thursday", "info": "\"I rode to see my brother Smyth at Hedingham, but he was not come from Higham. My brother Alby went this day to Boxford out getting the schoole. I dined there & came home this night.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-05", "day": "", "info": "\"My cosin Arthur Barnardiston came from Hundon court & lay here.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-06", "day": "Friday", "info": "\"Mr Fayrecloth with cosin Arthur Barnardiston dined here. Arthur Barnardiston rode home.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-06", "day": "", "info": "In the afternoone Mr Owen was [here] 2 houres. I walkt with him & Mr Kempe to Butcher[’s] stile\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-07", "day": "Saturday", "info": "\"Mr Boreman, minister of Stansfeild came to Sir Thomas on foot by 9 in the morning.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-08", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his text, Acts 2, 42: ‘& they continued in the A[postles’] doctrine.’ He insisted on breaking of bread intending shortly to have a sacrament.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-09", "day": "Monday", "info": "\"Here dined at Ketton one Mr Benningfeild & his nephew, the uncle a pleasant man & a bachelour, citizen, both Suffolk men. I rode to Liston after dinner & lay there.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-09", "day": "", "info": "\"Mr Ellis broute me a letter this morning from the Comittee of Excise for us to come with or acount [sic] & mony!\"", "category": "News", "color": "#F28C28", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-10", "day": "Tuesday", "info": "\"I rode to Higham to my brother Smyth (who was then in his building) about the aforesaid letter\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-11", "day": "Wednesday", "info": "\"This afternoon we walked downe to Milford Hart with my cosin Coo.\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-12", "day": "Thursday", "info": "\"I sold my brother a little shornemane black nag for £4 10s. 0d.\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-13", "day": "Friday", "info": "\"One Mr Tribick, minister of Barfold in Suffolk dined here.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-13", "day": "", "info": "\"Mr Fayrecloth came up to arbitrate a difference about accounts betweene Thomas Hickman & my Lady senior, concerning £6 it was114 apeared Mr Hickman would have cheated her of.\" ", "category": "Other business", "color": "#82C7E8", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-14", "day": "Saturday", "info": "\"Sir Thomas came home from Bury assizes & broute the newes of my Lord Allinghton’s death, that he was buried at London the morning before & died of the plague. There was none executed at this assizes: one Mr Keeble, an Ipswich man, sate on the life & death bench & Trowre on the other.\"", "category": "News", "color": "#F28C28", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-15", "day": "Sunday", "info": "\"Mr Fayrecloth preacht his former text in further preparation to the sacrament. In the afternoone read part of the ordinance for the goverment [sic] of the church: soe much as concerned the power of examination &c. given to the elders in relation to the sacrament.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-16", "day": "Monday", "info": "\"The court day at Ketton. Mr Cole was steward. Sir Thomas & Mr Kempe went down to Mr Fayrecloth to know [the] sense of Thomas Hickman in relation to his cariage towards his Lady in his accounts about that [?]macon’s115 £6 &c, who then gave it [in] his hand that T.H. dealt unjustly in that account.\"", "category": "Other business", "color": "#82C7E8", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-16", "day": "", "info": "\"Mr Cole & the jurors dined here.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-17", "day": "Tuesday", "info": "\"I rode to Liston to carry my brother his black nag he boute of me\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-17", "day": "", "info": "\"Cald at Giles Barnardiston’s, who was come to Clare to live & treated with him about Hart’s farme in Clare\"", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-18", "day": "Wednesday", "info": "\"My brother Clopton, cosin Coo & I went downe to Milford in the afternoone, playd at shovegroat at the Heart, saw a draught of pikes at the flogging pitt.\"", "category": "Leisure", "color": "#8E44AD", "weekday_index": 3, "weekday_display": "Wednesday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-19", "day": "Thursday", "info": "\"Cosin John Eden that was prisoner in Colchester to Goring with the comittee men dined here & Mr Firmyn & John Eden’s daughter.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 4, "weekday_display": "Thursday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-20", "day": "Friday", "info": "\"I was bewildred in my way from Clare to Ketton & made 8 or 9 mile\"", "category": "Personal business", "color": "#6B7280", "weekday_index": 5, "weekday_display": "Friday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-21", "day": "Saturday", "info": "\"I stayd at home at Ketton.\"", "category": "Personal business", "color": "#6B7280", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-21", "day": "", "info": "\"The Lord Allinghton was broute from London & buried at Horsehead\"", "category": "News", "color": "#F28C28", "weekday_index": 6, "weekday_display": "Saturday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-22", "day": "Sunday", "info": "\"Mr Kemp preacht: his text Psalm 82, 11, ‘Teach me oh God thy statutes & I will walk in thy way.\"", "category": "Sermon - Sunday", "color": "#F2C94C", "weekday_index": 0, "weekday_display": "Sunday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-23", "day": "Monday", "info": "\"Came home by Robert Webb’s & drunke there.\"", "category": "Social", "color": "#2F80ED", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-23", "day": "", "info": "\"In the afternoone I walkt to Hundon Park to see Captain French, who should this day have gone home but stayd to see me. I met him by the way a setting toward night with Samuel & Captain Robert Sparrow, who was that night my bedfellow at the Park.\"", "category": "Personal business", "color": "#6B7280", "weekday_index": 1, "weekday_display": "Monday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-24", "day": "Tuesday", "info": "\"Boute an iron grey nag\" ", "category": "Farming", "color": "#8B5A2B", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-24", "day": "", "info": "\"I had 2 letters from my brother Mark Mott\" ", "category": "News", "color": "#F28C28", "weekday_index": 2, "weekday_display": "Tuesday", "historical_year": 1648, "month_key": "1648-10"}, {"date": "1648-10-25", "day": "Wednesday", "info"
